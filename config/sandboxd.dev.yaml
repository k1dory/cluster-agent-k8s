# Local development: no Kubernetes, no Postgres. `make dev` uses this file.
listen:
  api: "127.0.0.1:8080"
  gateway: "127.0.0.1:8081"
  ingress: "127.0.0.1:8082"
api_token: "dev-token"
api_tokens:
  - { token: "alice-token", tenant: alice }
policies_dir: policies
secrets_dir: var/secrets
ca:
  dir: var/ca
  cert_ttl: 1h
gateway:
  ip: 10.77.77.1
  caddyfile_out: var/Caddyfile      # rendered only; set caddy_admin to push into a local caddy
  dns_listen: "127.0.0.1:15353"      # try: dig @127.0.0.1 -p 15353 git.example.com
runtime: fake
bootstrap_tokens_file: config/bootstrap-tokens.dev.yaml
agent:                              # version catalogue for `sandboxctl create -version` / `sandboxctl rollout`
  default: agent:dev
  versions: { stable: agent:dev, canary: agent:dev-next }
sandbox:
  default_idle_timeout: 1h
  idle_check_every: 10s
preview:
  domain: preview.localhost
  ticket_key: dev-ticket-key

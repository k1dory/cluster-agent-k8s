# sandboxd configuration. ${VAR} is expanded from the environment, so secrets stay out of git.
listen:
  api: ":8080"             # your client (UI, CLI, CI) → bearer token
  gateway: "127.0.0.1:8081" # Caddy only: /authz, /bootstrap, /agent/*
  ingress: ":8082"          # preview proxy; Caddy *.preview.<domain> → here
api_token: "${SANDBOXD_API_TOKEN}"
# Tenant-scoped tokens: each sees only its own sandboxes, runs, events, usage and trace.
# api_tokens:
#   - { token: "${ACME_TOKEN}", tenant: acme }
# Quotas per tenant (0 = unlimited); `default` covers tenants not listed.
quotas:
  default: { max_sandboxes: 0, max_awake: 0 }
  # tenants:
  #   acme: { max_sandboxes: 20, max_awake: 5 }
database_url: "${DATABASE_URL}"   # empty = in-memory (dev only)
policies_dir: policies
secrets_dir: /etc/sandbox/secrets  # tenants/<tenant>/<name>, shared/<name>
ca:
  dir: /var/lib/sandboxd/ca        # ca.crt + ca.key for agent identities (generated if missing)
  cert_ttl: 168h                   # 7 days; retirement on pod deletion is what actually revokes
gateway:                           # sandboxd configures Caddy and serves DNS from the policies
  ip: 10.77.77.1                   # this host's address on the sandbox VLAN
  caddy_admin: http://127.0.0.1:2019
  caddyfile_out: /var/lib/sandboxd/Caddyfile
  dns_listen: "10.77.77.1:53"
  api_host: api.sandbox.internal
  registrar_host: registrar.sandbox.internal
  registrar_port: 8443
  preview_tls: ""                  # "" = on-demand certs; "dns cloudflare {env.CF_API_TOKEN}" needs a Caddy build with that module
  access_log: stdout
  strict_sni: true
runtime: kube                      # kube | fake
kube:
  kubeconfig: ""                   # empty = in-cluster
  namespace: agent-sandbox
  image: registry.example.com/agent-sandbox/agent:latest
  service_account: agent
  network_attachment: agent-sandbox/sandbox-vlan
  runtime_class: ""                # "gvisor" or "kata" once the RuntimeClass exists
  storage_class: ""
  volume_size: 10Gi
  cpu_request: 250m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  harness_command: 'claude -p "$SANDBOX_TASK" --output-format stream-json --verbose'
  env:
    ANTHROPIC_BASE_URL: https://api.anthropic.com   # the gateway injects the real key
sandbox:
  default_idle_timeout: 1h
  ready_timeout: 3m
  idle_check_every: 1m
# Accounting: GET /v1/usage prices pod time with this; the trace records gateway decisions.
accounting:
  pod_hour_usd: 0        # 0 = report pod time without a price
  egress_trace: all      # all | denied | off  (requests to the control-plane API are never traced)

preview:
  domain: preview.example.com
  auth_url: https://ai.example.com/api/preview/auth   # your auth service checks the user, mints a ticket
  ticket_key: "${PREVIEW_TICKET_KEY}"
  cookie_ttl: 1h
  hits_as_activity: true

# sandboxd configuration. ${VAR} is expanded from the environment, so secrets stay out of git.
listen:
  api: ":8080"             # your client (UI, CLI, CI) → bearer token
  gateway: "127.0.0.1:8081" # Caddy only: /authz, /bootstrap, /agent/*
  ingress: ":8082"          # preview proxy; Caddy *.preview.<domain> → here
api_token: "${SANDBOXD_API_TOKEN}"
# Tenant API keys are issued through the API (sandboxctl keys create -tenant acme -name ci);
# max_ttl caps their lifetime (0 = keys may be permanent).
api_keys:
  max_ttl: 0s
# Static tenant-scoped tokens (optional, next to the keys): each sees only its own sandboxes.
# api_tokens:
#   - { token: "${ACME_TOKEN}", tenant: acme }
# OIDC: JWTs from this issuer are accepted next to the static tokens. The tenant comes from
# tenant_claim (a string, or a list filtered by tenant_prefix), the admin role from admin_claim.
# The token's expiry bounds the API session; with ttl_from_token also the sandboxes it creates
# and the agent certificates issued inside them.
# oidc:
#   issuer: https://login.example.com/realms/platform
#   client_id: sandboxd
#   tenant_claim: groups
#   tenant_prefix: "sandbox-tenant:"
#   admin_claim: roles
#   admin_value: sandbox-admin
#   ttl_from_token: true
# Quotas per tenant (0 = unlimited); `default` covers tenants not listed.
quotas:
  default: { max_sandboxes: 0, max_awake: 0 }
  # tenants:
  #   acme: { max_sandboxes: 20, max_awake: 5 }
database_url: "${DATABASE_URL}"   # empty = in-memory (dev only); required for more than one replica
policies_dir: policies
policies_strict: false             # true: a policy without `tenants:` is admin-only, unknown slugs are refused
secrets_dir: /etc/sandbox/secrets  # file provider: tenants/<tenant>/<name>, shared/<name>
# Credentials tenants bring through the API (PUT /v1/credentials/{name}): encrypted at rest under
# this key (openssl rand -hex 32); secret:NAME resolves from them first. Empty disables the API.
credentials:
  key: "${CREDENTIALS_KEY}"
# secrets:                         # external provider instead of the directory
#   provider: vault                # vault (HashiCorp Vault or OpenBao, KV v2) | infisical | file
#   cache_ttl: 60s
#   vault:
#     addr: https://vault.example.com
#     token: "${VAULT_TOKEN}"      # or kubernetes_role: sandboxd (login with the pod's SA token)
#     mount: secret
#     tenant_path: agent-sandbox/tenants/{tenant}   # keys of this KV secret are the names
#     shared_path: agent-sandbox/shared
#   infisical:
#     site_url: https://app.infisical.com
#     client_id: "${INFISICAL_CLIENT_ID}"
#     client_secret: "${INFISICAL_CLIENT_SECRET}"
#     project_id: ...
#     environment: prod
#     tenant_path: /tenants/{tenant}
#     shared_path: /shared
ca:
  dir: /var/lib/sandboxd/ca        # ca.crt + ca.key for agent identities (generated if missing)
  source: file                     # db: one key shared by every replica through Postgres
  cert_ttl: 168h                   # 7 days; retirement on pod deletion is what actually revokes
# Agent versions: names tenants may use as agent_version (create) or version (rollout); the admin
# may also pass any image reference. default is used when a request names none.
agent:
  default: registry.example.com/agent-sandbox/agent:1.4.2
  versions:
    stable: registry.example.com/agent-sandbox/agent:1.4.2
    canary: registry.example.com/agent-sandbox/agent:1.5.0-rc1
gateway:                           # sandboxd configures Caddy and serves DNS from the policies
  ip: 10.77.77.1                   # this host's address on the sandbox VLAN
  caddy_admin: http://127.0.0.1:2019
  caddyfile_out: /var/lib/sandboxd/Caddyfile
  dns_listen: "10.77.77.1:53"
  api_host: api.sandbox.internal
  registrar_host: registrar.sandbox.internal
  registrar_port: 8443
  preview_tls: ""                  # "" = on-demand certs; "dns cloudflare {env.CF_API_TOKEN}" needs a Caddy build with that module
  access_log: stdout
  strict_sni: true
runtime: kube                      # kube | fake
kube:
  kubeconfig: ""                   # empty = in-cluster
  namespace: agent-sandbox
  image: registry.example.com/agent-sandbox/agent:latest
  service_account: agent
  network_attachment: agent-sandbox/sandbox-vlan
  runtime_class: ""                # "gvisor" or "kata" once the RuntimeClass exists
  storage_class: ""
  volume_size: 10Gi
  cpu_request: 250m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  # The runner appends --mcp-config "$SANDBOX_MCP_CONFIG" to this default command when the sandbox's
  # connections give the agent MCP servers; a custom command names "$SANDBOX_MCP_CONFIG" itself.
  harness_command: 'claude -p "$SANDBOX_TASK" --output-format stream-json --verbose'
  # Continues a run that a forced rollout interrupted: $SANDBOX_SESSION is the harness session id
  # captured from its output, $SANDBOX_RESUME_PROMPT the continuation text (resume_prompt below).
  harness_resume_command: 'claude -p "$SANDBOX_RESUME_PROMPT" --resume "$SANDBOX_SESSION" --output-format stream-json --verbose'
  # Codex: 'codex exec resume "$SANDBOX_SESSION" "$SANDBOX_RESUME_PROMPT" --json'
  resume_prompt: ""
  pod_firewall: true                 # init container with NET_ADMIN locks egress to the gateway (cross-node isolation)
  gateway_ca_configmap: agent-sandbox-gateway-ca   # where the gateway root is published for the pods
  env:
    ANTHROPIC_BASE_URL: https://api.anthropic.com   # the gateway injects the real key
sandbox:
  default_idle_timeout: 1h
  ready_timeout: 3m
  idle_check_every: 1m
# Accounting: GET /v1/usage prices pod time with this; the trace records gateway decisions.
accounting:
  pod_hour_usd: 0        # 0 = report pod time without a price
  egress_trace: all      # all | denied | off  (requests to the control-plane API are never traced)

preview:
  domain: preview.example.com
  auth_url: https://ai.example.com/api/preview/auth   # your auth service checks the user, mints a ticket
  ticket_key: "${PREVIEW_TICKET_KEY}"
  cookie_ttl: 1h
  hits_as_activity: true

# Policy-as-Code gate on its own (the GitHub twin is .github/workflows/policies.yaml): the same
# `make ci-policy` target (docs/ci-contract.md), triggered on the policy paths.
name: policies
on:
  pull_request:
    paths: ["policies/**", "internal/policy/**", "internal/gateway/**"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-policy

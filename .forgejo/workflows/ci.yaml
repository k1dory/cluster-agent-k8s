# The product CI on Forgejo Actions, under the shared contract (docs/ci-contract.md): the same
# `make ci-<group>` targets as .github/workflows/ci.yaml and .gitlab-ci.yml, with Forgejo's
# actions for checkout and Go. The runner needs: Go (set up here), curl and tar (the targets
# download Caddy and Helm at the pinned versions), and, for the `images` and `git-adapter-e2e`
# jobs, a runner label whose host offers Docker (a daemon the job can reach, e.g. the socket
# mounted into the job container, or a host runner) and python3 with PyYAML; the docker CLI is
# downloaded by the target when the runner has none. Adjust `runs-on` labels to your runners.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  versions:
    runs-on: docker
    outputs:
      caddy: ${{ steps.v.outputs.caddy }}
      postgres: ${{ steps.v.outputs.postgres }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - id: v
        run: hack/ci/versions.sh forgejo >> "$GITHUB_OUTPUT"
  unit:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-build
      - run: make ci-vet
      - run: make ci-unit
      - run: make ci-policy
  postgres:
    needs: versions
    runs-on: docker
    services:
      postgres:
        image: ${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox_test
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wait for the database
        run: for i in $(seq 1 30); do pg_isready -h postgres -U sandbox 2>/dev/null && break; sleep 2; done
      - run: make ci-postgres
        env:
          # Services are reachable by their name from the job container.
          SANDBOX_TEST_POSTGRES_URL: postgres://sandbox:sandbox@postgres:5432/sandbox_test?sslmode=disable
  caddy:
    needs: versions
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        caddy: ${{ fromJSON(needs.versions.outputs.caddy) }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-caddy CADDY_VERSION=${{ matrix.caddy }}
  helm:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: make ci-helm
  images:
    runs-on: docker-host
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-images
  git-adapter-e2e:
    runs-on: docker-host
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-e2e-git

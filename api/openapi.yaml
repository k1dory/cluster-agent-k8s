openapi: 3.1.0
info:
  title: agent-sandbox control API
  version: 0.1.0
  description: |
    Control plane for isolated agent sandboxes. Clients (a UI, a CLI, CI) talk only to this API;
    Kubernetes, the gateway and identities are hidden behind it.

    Two audiences:
    * **Platform API** (`/v1/...`, port 8080): bearer token, used by your client. The admin token
      (`api_token`) sees every tenant; a tenant token (`api_tokens[]`) is confined to its tenant:
      creation forces the tenant, foreign sandboxes answer 403, lists, usage and trace are filtered.
      With `oidc` configured, a JWT from the identity provider is accepted too: the tenant comes
      from a claim, the admin role from another, and the token's expiry bounds the session (and,
      with `ttl_from_token`, the sandboxes and agent certificates it creates). `GET /v1/whoami`
      shows the resolved principal.
    * **Ownership.** A policy's `tenants` list says which tenants may create sandboxes (and roll out
      agents) with that slug; a slug outside the list answers 403.
    * **Catalogue.** `AgentDefinition`s (`/v1/agents`) and `EnvironmentProfile`s (`/v1/environments`)
      are versioned configuration per tenant (the admin also keeps shared ones, tenant ""). Every PUT
      appends a revision, `expected_revision` makes it conditional (409). Revision numbers are never
      reused: DELETE marks an item deleted and keeps its history at `/revisions`; a later PUT under
      the same name continues the numbering. References are "name", "name@N" (pinned) or
      "shared/name[@N]"; a bare name is resolved in the caller's scope first, then among the shared
      items, and stored in the form it resolved to, so the scope of a dependency is fixed when the
      document is written. `POST /v1/sandboxes` with `agent_ref` takes the policy, repository,
      lifecycle defaults and the environment's launch parameters from the catalogue; the sandbox
      records `agent_ref` / `environment_ref` (with the scope), `agent_revision`,
      `environment_revision` and the rendered `launch`, and every run records the revisions it ran
      under. A profile's `env` reaches the agent container only and cannot set platform names
      (`SANDBOX_*`, `GATEWAY_IP`, `REGISTRAR_URL`, `API_URL`, `CERT_DIR`, `HOME`, `HARNESS_CMD`,
      `HARNESS_RESUME_CMD`, `GATEWAY_CA_FILE`: 422). The same documents are accepted as YAML files
      by `sandboxctl apply` (several, separated by `---`, apply in order).
    * **Connections** (`/v1/connections`) name external services (HTTP APIs, MCP servers) with the
      headers the gateway adds; credentials are `secret:NAME` references resolved from the tenant's
      secrets provider at request time and never stored, returned or traced. Agents list the
      connections they use; a sandbox records them (`connections`) and the gateway adds their
      headers (under the policy's own injections) to every allowed request for their hosts, through
      forward_auth and the MCP proxy alike.
    * **PolicyBindings** (`/v1/bindings`, admin writes) grant a policy slug to a tenant at runtime,
      with an expiry and per-slug limits. Removing or expiring a binding revokes the slug: new
      sandboxes and wakes are refused, the gateway denies running agents at their next request and
      the reconciler stops their pods. **TenantSettings** (`/v1/tenants/{tenant}/settings`, admin
      writes) hold a tenant's quota and the environments its agents may use. Both are versioned
      like the catalogue and keep their history.
    * **Versions.** Every sandbox carries `agent_version` (the agent image its pod runs),
      `desired_version` (a rollout not yet applied) and `env_version` (fingerprint of policy content,
      harness command, image and pod environment the pod was started under). `GET /v1/version`
      lists the control plane build, the version catalogue and the current environment version per
      slug; `POST /v1/rollouts` moves agents between versions, with canary shares, deferred or forced
      updates and resume runs.
    * **Agent API** (`/agent/...`, port 8081): reached by the agent pod through the mTLS gateway;
      identity comes from the client certificate that Caddy forwards in `X-Agent-Cert`.
      `/authz` and `/bootstrap` on the same port are called by Caddy and the init container.

    Contract notes:
    * **Errors** are always `{error, code, request_id}`; `code` is stable
      (`bad_request`, `unauthorized`, `forbidden`, `not_found`, `conflict`, `too_large`,
      `quota_exceeded`, `upstream_failed`, `internal`, `unavailable`). `request_id` also comes back
      as the `X-Request-Id` header and is in the server log; send your own `X-Request-Id` to correlate.
    * **Malformed query parameters are 400**, never silently defaulted.
    * **Paging**: list endpoints take `limit` and `after`. `X-Next-Cursor` is present only when
      another page exists (the server fetches one row more than `limit`); its value is opaque and
      keeps working after the anchor row is deleted or stops matching the filter. Event endpoints
      use the numeric event id as cursor.
    * **Idempotency**: `POST /v1/sandboxes` and `POST .../runs` honour `Idempotency-Key`. The key is
      reserved before the request runs: a concurrent repeat gets 409 with `Retry-After: 1`, a repeat
      with a different body gets 422, a repeat after success replays the stored response with
      `Idempotency-Replayed: true` (24h, per tenant and route).
    * Unknown routes and methods answer the same JSON error shape (404 / 405 with `Allow`).
servers:
  - url: http://localhost:8080
    description: platform API
security:
  - bearer: []
tags:
  - name: sandboxes
  - name: catalogue
  - name: connections
  - name: tenancy
  - name: apply
  - name: rollouts
  - name: runs
  - name: conversation
  - name: files
  - name: events
  - name: preview
  - name: accounting
  - name: agent
  - name: gateway
paths:
  /v1/sandboxes:
    get:
      tags: [sandboxes]
      summary: List sandboxes
      parameters:
        - { name: tenant, in: query, schema: { type: string }, description: "Admin only; tenant tokens are scoped already" }
        - { name: owner, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [creating, waking, running, stopping, sleeping, deleting, error] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sandbox" }
    post:
      tags: [sandboxes]
      summary: Create a sandbox and start its first pod
      description: |
        The record is created first; if the cluster then refuses the volume or pod, you still get
        201 with `status: error` and the reason in `error`. The sandbox is yours to wake again or
        delete. Supports `Idempotency-Key`. A tenant token forces its tenant (403 for another).
        A tenant whose settings list allowed environments must create through `agent_ref`: the
        bare-slug path runs the server's default environment and answers 403 for such a tenant.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandbox" }
      responses:
        "201":
          description: Created (status is `waking` until the pod is ready, `error` if the cluster refused)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "Another tenant's scope; the tenant does not own the slug (policy list or binding); the environment is not allowed by the tenant settings, or a restricted tenant created by bare slug", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Idempotency-Key request still in progress (Retry-After)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Idempotency-Key reused with a different body", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [sandboxes]
      summary: Get a sandbox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [sandboxes]
      summary: Change settings of a sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSandbox" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sandboxes]
      summary: Delete a sandbox, its pod and its volume
      description: |
        204 means pod, volume and record are gone. If the cluster refuses, the answer is 502 and
        the record stays with `status: deleting` and the reason in `error`; the server retries on
        its sweep and a repeated DELETE retries at once. Runs and events are kept for accounting.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/sleep:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Sleep now (delete the pod, keep the volume)
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Cancel a run in progress instead of refusing with 409.
      responses:
        "200":
          description: Sleeping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/wake:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Wake without a task (for example to serve the preview)
      responses:
        "200":
          description: Waking or already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
  /v1/sandboxes/{id}/touch:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Record user activity (postpones the idle timer)
      responses:
        "204": { description: Recorded }
  /v1/sandboxes/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [runs]
      summary: List runs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, done, failed, cancelled] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
    post:
      tags: [runs]
      summary: Queue a task for the agent; wakes a sleeping sandbox
      description: |
        The run is stored first. If waking the sandbox fails you still get 202: the run stays
        queued and starts on the next successful wake; the sandbox shows the failure. Supports
        `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, description: Task text handed to the harness }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/runs/{run}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    get:
      tags: [runs]
      summary: Get one run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/runs/{run}/cancel:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      summary: Cancel a queued or running run (the agent receives a run.cancel event and stops the harness)
      responses:
        "200":
          description: Cancelled (or already finished)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /v1/sandboxes/{id}/runs/{run}/input:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      summary: Send a user message to a queued or running run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "Non-empty; written to the harness stdin" }
      responses:
        "204": { description: Persisted in the event stream (a storage failure is a 500, never a silent 204) }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Run already finished", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [conversation]
      summary: Send the next message of the conversation
      description: |
        A run in progress (or queued) receives the message as input (delivery `input`; with a
        stream-json harness it is answered in the same process). Otherwise a new run continues the
        latest harness session with the message as its prompt (`resumed`), or starts a fresh
        conversation when there is none (`new`). JSON `{text, attachments}` names workspace files
        already uploaded; multipart/form-data with a `text` field and `file` parts uploads each file
        to `uploads/<name>` first. Attached paths are listed after the text so the agent knows where
        to look. Supports `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                attachments: { type: array, items: { type: string }, description: "Workspace paths (relative to /workspace)" }
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string }
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  delivery: { type: string, enum: [input, resumed, new] }
                  files: { type: array, items: { type: string }, description: "Workspace paths the attachments were written to" }
        "409": { description: "Sandbox is being deleted", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [conversation]
      summary: The conversation so far (one page)
      description: Turns derived from the event stream. `X-Next-Cursor` is the last event scanned; continue with `?after=`.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: "Event id to continue after" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 }, description: "Events to scan" }
        - { name: raw, in: query, schema: { type: boolean, default: false }, description: "Also return harness output that is not a turn (role log)" }
      responses:
        "200":
          description: Turns
          headers: { X-Next-Cursor: { schema: { type: string } } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Message" } } } }
  /v1/sandboxes/{id}/messages/stream:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [conversation]
      summary: The conversation as server-sent events (replay after ?after or Last-Event-ID, then live)
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: raw, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: "text/event-stream; event = role, id = event id, data = Message" }
  /v1/sandboxes/{id}/messages/close:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [conversation]
      summary: End the open conversation
      description: The runner closes the harness's input (`run.close`); the harness exits and the run finishes with its result. The next message resumes the session in a new run.
      responses:
        "200": { description: The run being closed, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "409": { description: "No run in progress", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/runs/{run}/close:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [runs]
      summary: Close a run's conversation (a queued run is cancelled instead)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /v1/sandboxes/{id}/files:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [files]
      summary: List the workspace below a path
      description: |
        Performed by the agent pod on request (it is the only one that sees the volume), over the
        agent API. A sleeping sandbox is woken first unless `wake=false` (then 409). Paths are
        relative to /workspace; nothing outside it is reachable.
      parameters:
        - { name: path, in: query, schema: { type: string }, description: "Directory, relative to /workspace (default: the workspace root)" }
        - { name: depth, in: query, schema: { type: integer, default: 1, minimum: 1, maximum: 8 } }
        - { name: wake, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/FSEntry" } }
                  truncated: { type: boolean, description: "More than 5000 entries" }
        "404": { description: "No such directory", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Sandbox asleep and wake=false, or being deleted", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: "The pod did not answer in time", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/files/content:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [files]
      summary: Read a workspace file (up to 16 MiB)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: wake, in: query, schema: { type: boolean, default: true } }
      responses:
        "200": { description: "The file, with its detected Content-Type and X-File-Size" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { description: "File larger than 16 MiB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { $ref: "#/components/responses/Error" }
    put:
      tags: [files]
      summary: Write a workspace file (the request body, up to 16 MiB; parents are created)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: wake, in: query, schema: { type: boolean, default: true } }
      requestBody: { required: true, content: { "*/*": { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Written, content: { application/json: { schema: { type: object, properties: { path: { type: string }, size: { type: integer } } } } } }
        "413": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/events:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [events]
      summary: Event stream (SSE) with replay, or a JSON page with stream=false
      description: |
        Default: `text/event-stream`, each message is `id: <event id>`, `event: <type>`, `data: <Event JSON>`.
        Pass `after` (or the `Last-Event-ID` header) to replay from the persisted log, `run` to see one run only.
        With `stream=false` the same filter returns a JSON array (up to `limit`, default 1000) and closes;
        a full page carries `X-Next-Cursor` (the last event id) for the next `after`.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: run, in: query, schema: { type: string } }
        - { name: stream, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, default: 1000 } }
      responses:
        "200":
          description: Stream or page
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /v1/sandboxes/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [preview]
      summary: Expose a port of the sandbox under a stable host name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port: { type: integer, description: "0 removes the preview" }
                access: { type: string, enum: [link, sso, members], default: members }
      responses:
        "200":
          description: Preview set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
  /v1/sandboxes/{id}/preview/ticket:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [preview]
      summary: Mint a short-lived sign-in ticket for the preview (your auth service checked the user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
                next: { type: string, description: "Path to open after sign-in; must start with /, default /" }
      responses:
        "200":
          description: Ticket and the callback URL to redirect the browser to (ticket and next are URL-escaped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  redirect: { type: string, format: uri }
        "409": { description: "Sandbox has no preview", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/agents:
    get:
      tags: [catalogue]
      summary: List AgentDefinitions visible in the scope (own + shared; admin picks a scope with ?tenant=)
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: Latest revisions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/agents/{name}:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [catalogue]
      summary: Get an AgentDefinition (latest, or ?revision=N)
      parameters: [{ name: revision, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [catalogue]
      summary: Create or update an AgentDefinition (appends a revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentDocument" }
      responses:
        "201": { description: Created (revision 1), content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "The tenant does not own the policy, or wrote into another scope", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "expected_revision is not the latest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Invalid document (unknown field, trailing data after the document, unknown environment or policy)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [catalogue]
      summary: Delete an AgentDefinition (its revisions stay as history, marked deleted_at, and can no longer be referenced; existing sandboxes keep their launch; a later PUT continues the numbering)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [catalogue]
      summary: History of an AgentDefinition, oldest first, deleted revisions included
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/environments:
    get:
      tags: [catalogue]
      summary: List EnvironmentProfiles visible in the scope
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: Latest revisions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/environments/{name}:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [catalogue]
      summary: Get an EnvironmentProfile (latest, or ?revision=N)
      parameters: [{ name: revision, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [catalogue]
      summary: Create or update an EnvironmentProfile (appends a revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentDocument" }
      responses:
        "201": { description: Created (revision 1), content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "409": { description: "expected_revision is not the latest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Invalid document (unknown field, trailing data, image not in the catalogue for a tenant, non-positive quantity, request above limit, platform variable in env)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [catalogue]
      summary: Delete an EnvironmentProfile (revisions stay as history, marked deleted_at; agents pinned to them stop resolving; a later PUT continues the numbering)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/environments/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [catalogue]
      summary: History of an EnvironmentProfile, oldest first, deleted revisions included
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/connections:
    get:
      tags: [connections]
      summary: List Connections visible in the scope (own + shared)
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: Latest revisions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/connections/{name}:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [connections]
      summary: One Connection (latest, or ?revision=N)
      parameters: [{ name: revision, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [connections]
      summary: Create or update a Connection (appends a revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionDocument" }
      responses:
        "201": { description: Created (revision 1), content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "Wrote into another scope", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "expected_revision is not the latest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Invalid document: unknown field, bad type or host, a credential header carrying a value instead of a secret: reference, a reference the tenant cannot resolve (the value is never echoed)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [connections]
      summary: Delete a Connection (history kept; agents naming it stop validating)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/connections/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [connections]
      summary: History of a Connection, oldest first, deleted revisions included
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/bindings:
    get:
      tags: [tenancy]
      summary: List a tenant's PolicyBindings (a tenant its own; the admin with ?tenant=)
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: Live bindings, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/bindings/{name}:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [tenancy]
      summary: One PolicyBinding (name = policy slug)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [tenancy]
      summary: Admin only. Grant the policy slug {name} to the tenant (?tenant= or the document's tenant), appending a revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyBindingDocument" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "Not the admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "expected_revision is not the latest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "No tenant, unknown policy, negative limit, expiry in the past", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [tenancy]
      summary: Admin only. Revoke the grant now (history kept). Running agents of the tenant under this slug are denied by the gateway and stopped by the reconciler
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/bindings/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [tenancy]
      summary: History of a PolicyBinding
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/tenants/{tenant}/settings:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
    get:
      tags: [tenancy]
      summary: A tenant's settings (its own; the admin any). 404 while the server defaults apply
      parameters: [{ name: revision, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [tenancy]
      summary: Admin only. Set the tenant's quota and allowed environments (appends a revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsDocument" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "Not the admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Negative quota, bad environment reference", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [tenancy]
      summary: Admin only. Return the tenant to the server defaults (history kept)
      responses:
        "204": { description: Reset }
        "404": { $ref: "#/components/responses/Error" }
  /v1/tenants/{tenant}/settings/revisions:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
    get:
      tags: [tenancy]
      summary: History of the tenant's settings
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/plan:
    post:
      tags: [apply]
      summary: Validate a bundle and report what applying it would change. Nothing is written
      description: |
        The body is a YAML stream (Content-Type application/yaml) or JSON (an array of documents or
        `{"documents": [...]}`); documents are strict. The whole bundle is validated at once, so an
        agent may name an environment or a connection the same bundle introduces. Every document is
        checked against the caller's authority (a tenant plans only in its own scope and the kinds it
        may write; PolicyBinding and TenantSettings are the admin's), compared with the current
        revision into a stable field diff, and given the revision apply must find
        (`expected_revision`). A document's own `expected_revision` that does not match the current
        revision is reported as a conflict. The result is deterministic for the same documents and
        state; `bundle` fingerprints the documents alone. An invalid bundle is still a 200 plan with
        `valid: false` and the problems per document.
      parameters: [{ $ref: "#/components/parameters/scope" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/Document" }
                - type: object
                  additionalProperties: false
                  properties:
                    documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
          application/yaml:
            schema: { type: string, description: "--- separated documents" }
      responses:
        "200": { description: The plan, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { description: "Unparsable input (unknown field, trailing data)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "Another tenant's scope", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/whoami:
    get:
      tags: [sandboxes]
      summary: Who the token is
      responses:
        "200":
          description: Principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { type: boolean }
                  tenant: { type: string, description: "Empty for the admin" }
                  subject: { type: string, description: "admin-token, tenant-token, or the OIDC subject" }
                  expires: { type: string, format: date-time, description: "OIDC tokens: when the credential expires (zero time for static tokens)" }
  /v1/version:
    get:
      tags: [rollouts]
      summary: Control plane build, agent version catalogue and environment versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandboxd: { type: string, description: "Build version of the control plane" }
                  agent:
                    type: object
                    properties:
                      default: { type: string, description: "Image used when a request names no version" }
                      versions:
                        type: object
                        additionalProperties: { type: string }
                        description: "Version names tenants may use → image references"
                  env:
                    type: object
                    additionalProperties: { type: string }
                    description: "Current environment version per policy slug; compare with a sandbox's env_version to see drift"
  /v1/rollouts:
    post:
      tags: [rollouts]
      summary: Move agents to another version
      description: |
        Selects sandboxes by exactly one of `sandbox`, `instance` (agent identity number), `slug` or
        `all`; a tenant token is confined to its own sandboxes and to slugs it owns. `percent` keeps a
        deterministic share of the selection (canary: the same percent targets the same sandboxes, a
        larger one a superset). For each target:

        * sleeping / error → `wake`: the version is applied on the next wake;
        * running and idle → `now`: the pod is replaced at once (the identity is retired, a new one issued);
        * running with a run in progress → `deferred`: applied when the run finishes, or with
          `force` → `forced`: the run is cancelled, the pod replaced, and (unless `resume: false`) a
          new run with `resume_of` and the captured harness `session` is queued so the agent
          continues the conversation on the new version;
        * creating / waking / stopping → `deferred`; deleting → `skipped`.

        Tenants may only name versions from the catalogue (`GET /v1/version`); the admin may pass
        any image reference. Every decision is a `rollout` event in the sandbox's trace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, description: "Version name (tenants) or image reference (admin)" }
                sandbox: { type: string }
                instance: { type: integer }
                slug: { type: string }
                all: { type: boolean }
                percent: { type: integer, minimum: 0, maximum: 100 }
                force: { type: boolean }
                resume: { type: boolean, default: true }
      responses:
        "200":
          description: Outcome per targeted sandbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, description: "Resolved image reference" }
                  selected: { type: integer }
                  targeted: { type: integer, description: "After percent" }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sandbox: { type: string }
                        slug: { type: string }
                        from: { type: string }
                        mode: { type: string, enum: [now, forced, deferred, wake, skipped] }
                        reason: { type: string }
                        run_id: { type: string, description: "forced: the interrupted run" }
                        resume_id: { type: string, description: "forced: the run that continues it" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /openapi.yaml:
    get:
      security: []
      summary: This specification
      responses: { "200": { description: OpenAPI 3.1 YAML } }
  /docs:
    get:
      security: []
      summary: Swagger UI for this specification
      responses: { "200": { description: HTML } }
  /v1/policies:
    get:
      tags: [sandboxes]
      summary: Loaded egress policy slugs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /v1/usage:
    get:
      tags: [accounting]
      summary: Cost and consumption report
      description: |
        What was consumed in the window, filtered by tenant, agent slug, sandbox or run, and
        optionally grouped. Sources: model tokens and cost reported by the harness per run,
        run wall time, sandbox pod time (from status transitions, priced with
        `accounting.pod_hour_usd`), and gateway decisions (`egress_allowed` / `egress_denied`).
        Runs and events are kept when a sandbox is deleted, so history stays billable.
        Default window: the last 30 days.
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD" }
        - { name: to, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD (exclusive)" }
        - { name: since, in: query, schema: { type: string }, description: "Go duration back from now, e.g. 24h, 720h" }
        - { name: group_by, in: query, schema: { type: string, enum: [tenant, slug, sandbox, run, day] } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/trace:
    get:
      tags: [accounting]
      summary: Event log across sandboxes (what a tenant's agents did)
      description: |
        Events of every sandbox matching the filter, oldest first: status changes, run
        lifecycle, user input and every gateway decision (`egress.allow` / `egress.deny`, data is
        an `Egress` object). `run.output` is excluded unless `type` lists it or is `all`.
        `stream=true` switches to SSE and keeps following live events after the replay;
        reconnect with `Last-Event-ID`.
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string }, description: "Comma-separated event types, or `all`" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: "Event id cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
        - { name: stream, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Page or stream
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        "200": { description: OK }

  /agent/runs/next:
    get:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Long-poll for the next queued run of the calling sandbox
      parameters:
        - name: wait
          in: query
          schema: { type: string, default: 30s }
      responses:
        "200":
          description: A run, now marked running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "204": { description: Nothing queued within `wait` }
  /agent/runs/{run}/events:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Append output (one event per line of the body)
      description: |
        Limits: 4 MiB per request, 1 MiB per line. Lines up to the first violation are stored and
        the 413 message says how many (`stored N lines`), so a retry resumes after them. Lines
        that carry usage (Claude Code's `result`, generic `{"type":"usage"}`) update the run's accounting.

        Send `X-Batch-Id` (any id, kept across retries of the same batch): the server remembers how
        many lines of that batch it stored, records that before every response, and a retry skips
        them (`skipped` in the answer). Without it a retry after a lost response duplicates lines.
      parameters:
        - { name: X-Batch-Id, in: header, schema: { type: string, maxLength: 100 } }
      requestBody:
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer, description: "Lines of this batch stored in total" }
                  skipped: { type: integer, description: "Lines skipped because an earlier attempt stored them" }
        "413": { $ref: "#/components/responses/Error" }
  /agent/runs/{run}/input:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    get:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Long-poll for user input events addressed to this run
      description: |
        Returns `input` and `run.cancel` events with id > `after`, filtered in the store, so a
        run producing a lot of output cannot push them out of reach. Keep `after` at the id of the
        last event you received.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: wait, in: query, schema: { type: string, default: 30s } }
      responses:
        "200":
          description: Input events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /agent/runs/{run}/finish:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Mark the run finished
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exit_code: { type: integer }
                usage:
                  allOf: [{ $ref: "#/components/schemas/Usage" }]
                  description: Optional harness total; overrides what was parsed from the output stream
      responses:
        "204": { description: Recorded }

  /bootstrap:
    post:
      tags: [gateway]
      security: [{ bootstrapToken: [] }]
      summary: Issue the agent identity (called once by the init container)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr: { type: string, description: PEM certificate request; its subject is ignored }
      responses:
        "200":
          description: Certificate and instance number
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { type: integer }
                  slug: { type: string }
                  sandbox_id: { type: string }
                  tenant: { type: string }
                  cert: { type: string, description: PEM leaf certificate }
                  ca: { type: string, description: PEM agent CA root }
                  gateway_ca: { type: string, description: PEM root to trust for TLS to the gateway }
                  not_after: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
  /authz:
    get:
      tags: [gateway]
      security: []
      summary: Caddy forward_auth hook
      description: |
        Reads `X-Agent-Cert`, `X-Forwarded-Host`, `X-Forwarded-Method`, `X-Forwarded-Uri`.
        200 means allowed; response headers `Authorization`, `X-Api-Key`, `X-Agent-*` are copied
        onto the upstream request by Caddy. 403 otherwise.
      responses:
        "200": { description: Allowed }
        "403": { description: Denied }
  /crl.pem:
    get:
      tags: [gateway]
      security: []
      summary: CRL of retired, not yet expired agent certificates
      responses:
        "200":
          description: PEM CRL
          content:
            application/x-pem-file:
              schema: { type: string }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    mtls:
      type: mutualTLS
    bootstrapToken:
      type: http
      scheme: bearer
      description: Projected Kubernetes ServiceAccount token with audience `agent-sandbox`
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
    after:
      name: after
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page's `X-Next-Cursor`
    catalogName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    scope:
      name: tenant
      in: query
      schema: { type: string }
      description: "Admin only: the tenant scope to work in (empty = shared items). Tenant tokens are confined to their own scope and read shared items."
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 200 }
      description: |
        Repeating the request with the same key and body within 24h replays the stored 2xx response.
        409 while the first request is still running, 422 if the body differs.
  responses:
    Error:
      description: Error
      headers:
        X-Request-Id: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human-readable message }
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, too_large, quota_exceeded, upstream_failed, internal, unavailable]
        request_id: { type: string }
    CreateSandbox:
      type: object
      required: [name, slug, owner]
      properties:
        name: { type: string, description: "Project name, DNS label; part of the preview host" }
        slug: { type: string, description: "Agent definition (harness config, skills, policy file)" }
        owner: { type: string, description: "User login" }
        tenant: { type: string, description: "Billing/secret scope; defaults to owner" }
        repo: { type: string, description: "Repository URL the agent works on" }
        idle_timeout: { type: integer, description: "Seconds without user activity before sleep; 0 = never", default: 3600 }
        wake_on_preview: { type: boolean, default: true }
        ttl: { type: integer, description: "Seconds until the sandbox is deleted (pod, volume; runs and events stay); absent/0 = keep. Capped at the token's expiry when oidc.ttl_from_token is on" }
        agent_version: { type: string, description: "Version name from the catalogue (tenants) or an image reference (admin); absent = default" }
        agent_ref: { type: string, description: "AgentDefinition reference: name, name@N, or shared/name[@N]. Supplies slug, repo, lifecycle defaults and the environment's launch; slug must then be absent or equal to the agent's policy" }
    UpdateSandbox:
      type: object
      description: Only the fields present are changed
      properties:
        repo: { type: string }
        idle_timeout: { type: integer }
        wake_on_preview: { type: boolean }
        ttl: { type: integer, description: "Seconds from now; 0 removes the expiry" }
    Sandbox:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        owner: { type: string }
        tenant: { type: string }
        repo: { type: string }
        idle_timeout: { type: integer }
        wake_on_preview: { type: boolean }
        status: { type: string, enum: [creating, waking, running, stopping, sleeping, deleting, error] }
        ip: { type: string }
        instance: { type: integer, description: "Current identity number; grows on every wake" }
        pod_name: { type: string }
        agent_version: { type: string, description: "Agent image the current (or last) pod runs" }
        agent_ref: { type: string, description: "AgentDefinition the sandbox was created from, with its scope: name, or shared/name (absent for bare-slug sandboxes)" }
        connections: { type: array, items: { type: string }, description: "Connections the agent uses, as references from the sandbox tenant's scope, fixed at creation; the gateway adds their headers to requests for their hosts" }
        agent_revision: { type: integer }
        environment_ref: { type: string }
        environment_revision: { type: integer }
        launch: { $ref: "#/components/schemas/Launch" }
        desired_version: { type: string, description: "Rollout target not yet applied; absent when none" }
        env_version: { type: string, description: "Fingerprint of policy content, harness command, image and pod environment at the last pod start" }
        revision: { type: integer, format: int64, description: "Changes on every update; every write is conditional on it (optimistic locking across replicas)" }
        last_activity: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: "Deleted after this time when set" }
        preview:
          type: object
          nullable: true
          properties:
            port: { type: integer }
            access: { type: string, enum: [link, sso, members] }
            host: { type: string }
        error: { type: string }
    Run:
      type: object
      properties:
        id: { type: string }
        sandbox_id: { type: string }
        tenant: { type: string, description: "Copied from the sandbox; survives its deletion" }
        slug: { type: string }
        task: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        exit_code: { type: integer }
        usage: { $ref: "#/components/schemas/Usage" }
        agent_version: { type: string, description: "Agent image that executed the run" }
        agent_ref: { type: string, description: "Catalogue revisions the run executed under, fixed when it was claimed" }
        agent_revision: { type: integer }
        environment_ref: { type: string }
        environment_revision: { type: integer }
        resume_of: { type: string, description: "The run this one continues: after a forced rollout (mode resume) or as the next message of the conversation (mode message)" }
        mode: { type: string, enum: ["", resume, message], description: "Empty: a fresh task; resume: continues resume_of after a rollout; message: the task is the next message of resume_of's session" }
        session: { type: string, description: "Harness conversation id captured from the output (Claude Code session_id, Codex thread_id)" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Launch:
      type: object
      description: The environment profile rendered at creation, kept on the sandbox; every pod of the sandbox starts with it
      properties:
        image: { type: string }
        harness_command: { type: string }
        harness_resume_command: { type: string }
        resume_prompt: { type: string }
        model: { type: string, description: "Exported as SANDBOX_MODEL and ANTHROPIC_MODEL" }
        instructions: { type: string, description: "Exported as SANDBOX_INSTRUCTIONS" }
        env: { type: object, additionalProperties: { type: string } }
        cpu_request: { type: string }
        cpu_limit: { type: string }
        memory_request: { type: string }
        memory_limit: { type: string }
        volume_size: { type: string }
        runtime_class: { type: string }
    CatalogItem:
      type: object
      description: One revision of a catalogue resource
      properties:
        kind: { type: string, enum: [AgentDefinition, EnvironmentProfile, Connection, PolicyBinding, TenantSettings] }
        tenant: { type: string, description: "Empty for shared items; the grantee for a PolicyBinding; the tenant for TenantSettings" }
        name: { type: string }
        revision: { type: integer }
        description: { type: string }
        spec:
          oneOf:
            - { $ref: "#/components/schemas/AgentSpec" }
            - { $ref: "#/components/schemas/EnvironmentSpec" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, description: "Set once the item was deleted; the revision stays as history and cannot be referenced" }
    EnvironmentSpec:
      type: object
      required: [image]
      additionalProperties: false
      properties:
        image: { type: string, description: "Version name from the server catalogue; the admin may write an image reference" }
        harness:
          type: object
          additionalProperties: false
          properties:
            command: { type: string }
            resume_command: { type: string, description: "Continues a session: $SANDBOX_SESSION, the message (or the rollout prompt) in $SANDBOX_RESUME_PROMPT" }
            resume_prompt: { type: string, description: "What a rollout resume tells the harness (default: continue the task)" }
            input: { type: string, enum: [text, stream-json], description: "How messages reach the harness: a line on stdin, or Claude Code's streaming JSON input (keeps the conversation open)" }
            chat_idle: { type: integer, minimum: 0, description: "stream-json: seconds without a message after a turn before the runner closes the conversation (0 = 600)" }
        model:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, description: "Exported by the platform as SANDBOX_MODEL and ANTHROPIC_MODEL" }
            env: { type: object, additionalProperties: { type: string }, description: "Client settings such as ANTHROPIC_BASE_URL; platform names are refused" }
        resources:
          type: object
          additionalProperties: false
          description: "Kubernetes quantities, positive; a request must not exceed its limit. A request above the server's default limit raises that limit."
          properties:
            cpu_request: { type: string }
            cpu_limit: { type: string }
            memory_request: { type: string }
            memory_limit: { type: string }
            volume_size: { type: string }
        lifecycle:
          type: object
          additionalProperties: false
          properties:
            idle_timeout: { type: integer, minimum: 0 }
            ttl: { type: integer, minimum: 0 }
            wake_on_preview: { type: boolean }
        runtime_class: { type: string }
        env: { type: object, additionalProperties: { type: string }, description: "Agent container only; never shadows a platform or operator variable; platform names (SANDBOX_*, GATEWAY_IP, REGISTRAR_URL, API_URL, CERT_DIR, HOME, HARNESS_CMD, HARNESS_RESUME_CMD, GATEWAY_CA_FILE) are refused" }
    AgentSpec:
      type: object
      required: [policy, environment]
      additionalProperties: false
      properties:
        policy: { type: string, description: "Policy slug; the tenant must own it (admin may override)" }
        environment: { type: string, description: "EnvironmentProfile reference: name, name@N to pin, shared/name[@N] for a shared profile. A bare name is resolved (own scope, then shared) when the agent is written and stored in the resolved form, so a tenant profile created later under the same name does not capture it" }
        repo: { type: string }
        instructions: { type: string }
        connections: { type: array, items: { type: string }, description: "Connection references (name, or shared/name), resolved when the agent is written and stored in the resolved form; each must exist in the tenant's scope or among the shared ones" }
    EnvironmentDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [EnvironmentProfile] }
        tenant: { type: string, description: "Admin only: scope to write into (empty = shared)" }
        name: { type: string, description: "Must match the path when present" }
        description: { type: string }
        spec: { $ref: "#/components/schemas/EnvironmentSpec" }
        expected_revision: { type: integer, minimum: 0, description: "Conditional write: 0 = must not exist, N = latest must be N" }
    AgentDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [AgentDefinition] }
        tenant: { type: string }
        name: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        expected_revision: { type: integer, minimum: 0 }
    ConnectionSpec:
      type: object
      required: [type, host]
      additionalProperties: false
      properties:
        type: { type: string, enum: [http, mcp] }
        host: { type: string, description: "External host name (lower-case, no scheme or port) a policy serves" }
        headers:
          type: object
          additionalProperties: { type: string }
          description: "Headers the gateway adds for agents using this connection. Values are templates: secret:NAME is resolved from the tenant's secrets at request time. A credential header (Authorization, Cookie, anything named like a key or token) must be a reference such as \"Bearer secret:NAME\"; a literal value is refused and never echoed"
    ConnectionDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [Connection] }
        tenant: { type: string, description: "Admin only: scope to write into (empty = shared)" }
        name: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/ConnectionSpec" }
        expected_revision: { type: integer, minimum: 0 }
    PolicyBindingSpec:
      type: object
      additionalProperties: false
      properties:
        expires_at: { type: string, format: date-time, description: "The grant ends here; absent = until deleted" }
        max_sandboxes: { type: integer, minimum: 0, description: "Records the tenant may hold under this slug; 0 = tenant quota only" }
        max_awake: { type: integer, minimum: 0, description: "Pods at once under this slug" }
    PolicyBindingDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [PolicyBinding] }
        tenant: { type: string, description: "The grantee (or ?tenant=)" }
        name: { type: string, description: "The policy slug; must match the path" }
        description: { type: string }
        spec: { $ref: "#/components/schemas/PolicyBindingSpec" }
        expected_revision: { type: integer, minimum: 0 }
    TenantSettingsSpec:
      type: object
      additionalProperties: false
      properties:
        quota:
          type: object
          additionalProperties: false
          description: "Replaces the server's default quota for the tenant as a whole (0 = unlimited); absent = defaults"
          properties:
            max_sandboxes: { type: integer, minimum: 0 }
            max_awake: { type: integer, minimum: 0 }
        environments: { type: array, items: { type: string }, description: "Environment references the tenant's agents may use (name = its own, shared/name); empty = every visible one. Checked when an agent is written and when a sandbox is created" }
    TenantSettingsDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [TenantSettings] }
        tenant: { type: string, description: "Must match the path when present" }
        name: { type: string, enum: [settings] }
        description: { type: string }
        spec: { $ref: "#/components/schemas/TenantSettingsSpec" }
        expected_revision: { type: integer, minimum: 0 }
    Document:
      type: object
      required: [kind, spec]
      additionalProperties: false
      description: Any versioned resource document (the kind decides the spec schema)
      properties:
        kind: { type: string, enum: [AgentDefinition, EnvironmentProfile, Connection, PolicyBinding, TenantSettings] }
        tenant: { type: string }
        name: { type: string }
        description: { type: string }
        spec: { type: object }
        expected_revision: { type: integer, minimum: 0 }
    Plan:
      type: object
      properties:
        bundle: { type: string, description: "Fingerprint of the canonical documents (same files, same value)" }
        valid: { type: boolean }
        summary:
          type: object
          properties:
            create: { type: integer }
            update: { type: integer }
            noop: { type: integer }
            invalid: { type: integer }
        errors: { type: array, items: { type: string }, description: "Bundle-level problems (duplicates)" }
        changes:
          type: array
          description: In apply order (environments, connections, settings, bindings, agents), then by tenant and name
          items:
            type: object
            properties:
              kind: { type: string }
              tenant: { type: string }
              name: { type: string }
              action: { type: string, enum: [create, update, noop, invalid] }
              current_revision: { type: integer, description: "Live revision compared with (0 = none)" }
              expected_revision: { type: integer, description: "Revision apply must find for this change" }
              next_revision: { type: integer, description: "Revision the item will have after apply: the next number of its history (deleted revisions included) for create and update, the current one for noop. Pinned references in the bundle are checked against it" }
              diff:
                type: array
                description: Leaves of the canonical spec (and description) that differ, in path order
                items:
                  type: object
                  properties:
                    path: { type: string, example: spec.resources.cpu_limit }
                    from: { description: "Absent when the field is added" }
                    to: { description: "Absent when the field is removed" }
              errors: { type: array, items: { type: string } }
    Message:
      type: object
      description: One turn of a sandbox's conversation, derived from the event stream
      properties:
        id: { type: integer, format: int64, description: "The event it came from (resume with ?after=)" }
        run_id: { type: string }
        role: { type: string, enum: [user, assistant, tool, system, log] }
        text: { type: string }
        at: { type: string, format: date-time }
    FSEntry:
      type: object
      properties:
        path: { type: string, description: "Relative to /workspace" }
        type: { type: string, enum: [file, dir, symlink, other] }
        size: { type: integer, format: int64 }
        mod_time: { type: string, format: date-time }
    Usage:
      type: object
      description: |
        Model-side consumption of one run as reported by the harness. Claude Code's stream-json
        `result` line is parsed automatically; other harnesses print `{"type":"usage",...}` lines
        with these fields (added up) or send the total with `/agent/runs/{run}/finish`.
      properties:
        model: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        cost_usd: { type: number }
        turns: { type: integer }
    Egress:
      type: object
      description: Data of an egress.allow / egress.deny event
      properties:
        host: { type: string }
        method: { type: string }
        path: { type: string }
        code: { type: integer, description: "deny only: status answered to the agent" }
        reason: { type: string, description: "deny only" }
    Event:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sandbox_id: { type: string }
        tenant: { type: string }
        slug: { type: string }
        run_id: { type: string }
        type: { type: string, enum: [status, run.queued, run.started, run.output, run.finished, run.cancel, input, egress.allow, egress.deny, rollout] }
        data: { type: string, description: "status: new status; run.started: agent version; run.finished: final run status; egress.*: Egress JSON; rollout: {from, to, mode, run_id, resume_id}" }
        at: { type: string, format: date-time }
    UsageTotals:
      type: object
      properties:
        runs: { type: integer }
        runs_done: { type: integer }
        runs_failed: { type: integer }
        runs_cancelled: { type: integer }
        run_seconds: { type: number, description: "Sum of run wall time" }
        pod_seconds: { type: number, description: "Time sandbox pods were up (waking → stopping/sleeping/error)" }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        turns: { type: integer }
        egress_allowed: { type: integer, format: int64 }
        egress_denied: { type: integer, format: int64 }
        model_usd: { type: number, description: "As reported by the harness" }
        compute_usd: { type: number, description: "pod_seconds / 3600 × accounting.pod_hour_usd" }
        total_usd: { type: number }
    UsageReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string }
        pricing:
          type: object
          properties:
            pod_hour_usd: { type: number }
        total: { $ref: "#/components/schemas/UsageTotals" }
        rows:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  key: { type: string, description: "Group value (tenant, slug, sandbox id, run id or YYYY-MM-DD)" }
                  tenant: { type: string }
                  slug: { type: string }
                  sandbox_id: { type: string }
                  run_id: { type: string }
              - { $ref: "#/components/schemas/UsageTotals" }

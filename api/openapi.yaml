      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "Not the admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "expected_revision is not the latest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "No tenant, unknown policy, negative limit, expiry in the past", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [tenancy]
      summary: Admin only. Revoke the grant now (history kept). Running agents of the tenant under this slug are denied by the gateway and stopped by the reconciler
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/bindings/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [tenancy]
      summary: History of a PolicyBinding
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/tenants/{tenant}/settings:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
    get:
      tags: [tenancy]
      summary: A tenant's settings (its own; the admin any). 404 while the server defaults apply
      parameters: [{ name: revision, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [tenancy]
      summary: Admin only. Set the tenant's quota and allowed environments (appends a revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsDocument" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "Not the admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Negative quota, bad environment reference", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [tenancy]
      summary: Admin only. Return the tenant to the server defaults (history kept)
      responses:
        "204": { description: Reset }
        "404": { $ref: "#/components/responses/Error" }
  /v1/tenants/{tenant}/settings/revisions:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
    get:
      tags: [tenancy]
      summary: History of the tenant's settings
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/plan:
    post:
      tags: [apply]
      summary: Validate a bundle and report what applying it would change. Nothing is written
      description: |
        The body is a YAML stream (Content-Type application/yaml) or JSON (an array of documents or
        `{"documents": [...]}`); documents are strict. The whole bundle is validated at once, so an
        agent may name an environment or a connection the same bundle introduces. Every document is
        checked against the caller's authority (a tenant plans only in its own scope and the kinds it
        may write; PolicyBinding and TenantSettings are the admin's), compared with the current
        revision into a stable field diff, and given the revision apply must find
        (`expected_revision`). A document's own `expected_revision` that does not match the current
        revision is reported as a conflict. The result is deterministic for the same documents and
        state; `bundle` fingerprints the documents alone. An invalid bundle is still a 200 plan with
        `valid: false` and the problems per document.
      parameters: [{ $ref: "#/components/parameters/scope" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/Document" }
                - type: object
                  additionalProperties: false
                  properties:
                    documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
          application/yaml:
            schema: { type: string, description: "--- separated documents" }
      responses:
        "200": { description: The plan, content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
        "400": { description: "Unparsable input (unknown field, trailing data)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "Another tenant's scope", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/apply:
    post:
      tags: [apply]
      summary: Apply a planned bundle (one transaction per step, continued by key)
      description: |
        The body is as for `/v1/plan` plus the plan fingerprint: `plan` in the JSON wrapper, or
        `?plan=` for YAML. The bundle is planned again and refused with 409 when the fingerprint no
        longer matches (the state moved since the plan). Each step writes its item revision and its
        own completion in one transaction, guarded by the apply's version, so a step is either
        applied and recorded or neither and two replicas cannot both commit it. The idempotency key
        (`key`, `?key=`, the `Idempotency-Key` header, else the plan fingerprint) identifies the
        apply in the scope: the same key with the same bundle returns the same apply and finishes it
        if needed; another bundle under the key is 409 with the existing apply. Continuation re-plans
        the stored documents under the stored scope with its current rights: a pending step must
        still find the revision the plan expected (noop steps too), an applied step must still be the
        latest revision, every document must still validate; otherwise the apply stops with status
        `conflict` and the reason, the steps showing exactly what was applied. `source` (or
        `?repo=&ref=&commit=&path=` for YAML) is the Git provenance of the bundle: recorded on the
        apply and on every revision it writes.
      parameters:
        - { $ref: "#/components/parameters/scope" }
        - { name: plan, in: query, schema: { type: string } }
        - { name: key, in: query, schema: { type: string } }
        - { name: repo, in: query, schema: { type: string }, description: "YAML bodies: source.repo" }
        - { name: ref, in: query, schema: { type: string }, description: "YAML bodies: source.ref" }
        - { name: commit, in: query, schema: { type: string }, description: "YAML bodies: source.commit" }
        - { name: path, in: query, schema: { type: string }, description: "YAML bodies: source.path" }
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
                plan: { type: string }
                key: { type: string }
                source:
                  type: object
                  additionalProperties: false
                  properties:
                    repo: { type: string }
                    ref: { type: string }
                    commit: { type: string, description: "The commit the bundle file matches; omit for a modified file" }
                    path: { type: string }
          application/yaml:
            schema: { type: string }
      responses:
        "200": { description: "The apply (status done, failed, conflict or running when another replica holds it)", content: { application/json: { schema: { $ref: "#/components/schemas/Apply" } } } }
        "409": { description: "Plan does not match the state, or the key was used for another bundle (the existing apply is included)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "The bundle is not valid; the plan is included", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/applies:
    get:
      tags: [apply]
      summary: Applies of the scope, newest first
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Apply" } } } } }
  /v1/applies/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [apply]
      summary: One apply (a tenant sees its own)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Apply" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/applies/{id}/resume:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [apply]
      summary: Continue a stopped apply (failed, conflict, or left by another replica) after re-verifying state and rights
      responses:
        "200": { description: The apply, content: { application/json: { schema: { $ref: "#/components/schemas/Apply" } } } }
        "403": { description: "A tenant cannot resume the admin's apply", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/drift:
    get:
      tags: [apply]
      summary: Items an apply wrote that were since changed by hand or deleted
      description: |
        An item belongs to the apply that wrote its latest revision (its `source`). The report
        lists, for the scope, every such item whose live state is no longer that revision:
        `changed` (the latest revision has no source: written through the resource API, with the
        field diff from the applied revision) or `deleted`. Items nobody applied are not drift;
        items a later apply rewrote are in sync with it. Computed from the store alone. Drift the
        other way round (Git versus the platform) is `POST /v1/plan` with the bundle.
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Drift" } } } }
  /v1/rollback:
    post:
      tags: [apply]
      summary: Restore what an apply wrote, or one item to a revision, as a new plan and apply under the caller's current rights
      description: |
        Names an apply (every item it wrote goes back to the revision it replaced) or one item and
        a revision (0: the last revision an apply wrote). The restored documents are planned and
        applied like any bundle, so the result is a new revision whose `source.rollback` names the
        target. Grants (PolicyBinding, TenantSettings) are never restored and cannot be rolled back
        on their own; an item the apply created has no earlier revision and is listed under
        `skipped`; a document the caller may no longer write (a policy the tenant lost) makes the
        plan invalid and nothing is written. `dry_run` returns the plan alone.
      parameters: [{ $ref: "#/components/parameters/scope" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                apply: { type: string, description: "Roll back everything this apply wrote" }
                kind: { type: string, enum: [AgentDefinition, EnvironmentProfile, Connection] }
                tenant: { type: string, description: "Admin: the item's tenant (empty = shared)" }
                name: { type: string }
                revision: { type: integer, description: "0: the last revision an apply wrote" }
                key: { type: string, description: "Idempotency key of the apply (default: its plan fingerprint)" }
                dry_run: { type: boolean }
      responses:
        "200": { description: The rollback (plan, and the apply unless dry_run), content: { application/json: { schema: { $ref: "#/components/schemas/Rollback" } } } }
        "400": { description: "Neither an apply nor a kind and name, or a grant", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "Another tenant's item or the admin's apply", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "Unknown apply, item or revision", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "The state moved since the plan", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "invalid_plan (a document no longer validates under the caller's rights) or nothing_to_roll_back; the rollback is included", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/credentials:
    get:
      tags: [tenancy]
      summary: The scope's own credentials (metadata only)
      description: |
        Secrets a tenant brought through the API (BYOK): an LLM key, an MCP token, a Git
        credential. The value is encrypted at rest under the server's `credentials.key` and
        never returned; `fingerprint` (first 12 hex of its SHA-256) tells which value is loaded.
        `secret:NAME` references resolve from these first, then from the operator's provider.
        A tenant works in its own scope, the admin in a tenant's (`?tenant=`) or the shared one.
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Credential" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "503": { $ref: "#/components/responses/CredentialsDisabled" }
  /v1/credentials/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/scope" }
    get:
      tags: [tenancy]
      summary: One credential's metadata
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Credential" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CredentialsDisabled" }
    put:
      tags: [tenancy]
      summary: Add or replace the credential (the value goes in here and never comes out)
      description: A replacement bumps `version`; the next gateway request that references the name uses the new value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, maxLength: 65536 }
      responses:
        "200": { description: Replaced, content: { application/json: { schema: { $ref: "#/components/schemas/Credential" } } } }
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Credential" } } } }
        "400": { description: "Malformed JSON, unknown field, trailing data, or a body over the limit (the value itself may be up to 65536 bytes)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "422": { description: "Bad name or empty / oversized value", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/CredentialsDisabled" }
    delete:
      tags: [tenancy]
      summary: Remove the credential
      description: |
        Takes the tenant's value out of the resolution chain on the next request. References
        then fall through to a shared credential of the same name, then the operator's provider;
        only when none carries the name does the next request that needs it fail at the gateway
        (502, nothing partial is sent).
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/CredentialsDisabled" }
  /v1/tenants/{tenant}/keys:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
    get:
      tags: [tenancy]
      summary: A tenant's API keys (never their secrets)
      description: The admin reads every tenant's keys; a tenant principal (key, static token or OIDC user) reads its own tenant's.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/APIKey" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "503": { $ref: "#/components/responses/KeysDisabled" }
    post:
      tags: [tenancy]
      summary: Issue a key for the tenant (the secret is in this response only)
      description: |
        The admin bootstraps a tenant with its first key; the tenant then issues its own (one per
        pipeline or person). `ttl` is a Go duration (`720h`); empty means no expiry, capped by the
        server's `api_keys.max_ttl`. The secret is `sbk_<id>_<random>`; the store keeps a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, description: "1-64 characters: who or what holds the key" }
                ttl: { type: string, example: 720h }
      responses:
        "201": { description: The key with its secret, content: { application/json: { schema: { $ref: "#/components/schemas/IssuedKey" } } } }
        "400": { description: "Malformed JSON, unknown field, trailing data or a bad duration", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "422": { description: "Bad name or ttl", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/KeysDisabled" }
  /v1/tenants/{tenant}/keys/{id}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [tenancy]
      summary: One key (another tenant's key is 404)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/APIKey" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/KeysDisabled" }
    delete:
      tags: [tenancy]
      summary: Revoke the key now
      description: The next request with the key is refused on every replica; revoking a revoked key is fine (the earlier time stands).
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/KeysDisabled" }
  /v1/tenants/{tenant}/keys/{id}/rotate:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [tenancy]
      summary: Replace the key with a new secret
      description: |
        Issues a new key with the same tenant and name and retires this one: at once when `grace`
        is empty, else after `grace` so the holder can switch over. `ttl` is the new key's
        lifetime (empty: this key's remaining one). A revoked or expired key cannot be rotated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl: { type: string, example: 720h }
                grace: { type: string, example: 1h }
      responses:
        "201": { description: The new key with its secret; `replaces` names the old one, content: { application/json: { schema: { $ref: "#/components/schemas/IssuedKey" } } } }
        "400": { description: "Malformed JSON, unknown field, trailing data or a bad duration", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { description: "The key is revoked or expired, or a duration is negative", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/KeysDisabled" }
  /v1/whoami:
    get:
      tags: [sandboxes]
      summary: Who the token is
      responses:
        "200":
          description: Principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { type: boolean }
                  tenant: { type: string, description: "Empty for the admin" }
                  subject: { type: string, description: "admin-token, tenant-token, or the OIDC subject" }
                  expires: { type: string, format: date-time, description: "OIDC tokens: when the credential expires (zero time for static tokens)" }
  /v1/version:
    get:
      tags: [rollouts]
      summary: Control plane build, agent version catalogue and environment versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandboxd: { type: string, description: "Build version of the control plane" }
                  replica: { type: string, description: "The replica that answered (its pod name)" }
                  leader: { type: boolean, description: "Whether that replica runs the reconciler (holds the leadership lease)" }
                  agent:
                    type: object
                    properties:
                      default: { type: string, description: "Image used when a request names no version" }
                      versions:
                        type: object
                        additionalProperties: { type: string }
                        description: "Version names tenants may use → image references"
                  env:
                    type: object
                    additionalProperties: { type: string }
                    description: "Current environment version per policy slug; compare with a sandbox's env_version to see drift"
  /v1/rollouts:
    post:
      tags: [rollouts]
      summary: Move agents to another version
      description: |
        Selects sandboxes by exactly one of `sandbox`, `instance` (agent identity number), `slug` or
        `all`; a tenant token is confined to its own sandboxes and to slugs it owns. `percent` keeps a
        deterministic share of the selection (canary: the same percent targets the same sandboxes, a
        larger one a superset). For each target:

        * sleeping / error → `wake`: the version is applied on the next wake;
        * running and idle → `now`: the pod is replaced at once (the identity is retired, a new one issued);
        * running with a run in progress → `deferred`: applied when the run finishes, or with
          `force` → `forced`: the run is cancelled, the pod replaced, and (unless `resume: false`) a
          new run with `resume_of` and the captured harness `session` is queued so the agent
          continues the conversation on the new version;
        * creating / waking / stopping → `deferred`; deleting → `skipped`.

        Tenants may only name versions from the catalogue (`GET /v1/version`); the admin may pass
        any image reference. Every decision is a `rollout` event in the sandbox's trace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, description: "Version name (tenants) or image reference (admin)" }
                sandbox: { type: string }
                instance: { type: integer }
                slug: { type: string }
                all: { type: boolean }
                percent: { type: integer, minimum: 0, maximum: 100 }
                force: { type: boolean }
                resume: { type: boolean, default: true }
      responses:
        "200":
          description: Outcome per targeted sandbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, description: "Resolved image reference" }
                  selected: { type: integer }
                  targeted: { type: integer, description: "After percent" }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sandbox: { type: string }
                        slug: { type: string }
                        from: { type: string }
                        mode: { type: string, enum: [now, forced, deferred, wake, skipped] }
                        reason: { type: string }
                        run_id: { type: string, description: "forced: the interrupted run" }
                        resume_id: { type: string, description: "forced: the run that continues it" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /openapi.yaml:
    get:
      security: []
      summary: This specification
      responses: { "200": { description: OpenAPI 3.1 YAML } }
  /docs:
    get:
      security: []
      summary: Swagger UI for this specification
      responses: { "200": { description: HTML } }
  /v1/policies:
    get:
      tags: [sandboxes]
      summary: Loaded egress policy slugs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /v1/usage:
    get:
      tags: [accounting]
      summary: Cost and consumption report
      description: |
        What was consumed in the window, filtered by tenant, agent slug, sandbox or run, and
        optionally grouped. Sources: model tokens and cost reported by the harness per run,
        run wall time, sandbox pod time (from status transitions, priced with
        `accounting.pod_hour_usd`), and gateway decisions (`egress_allowed` / `egress_denied`).
        Runs and events are kept when a sandbox is deleted, so history stays billable.
        Default window: the last 30 days.
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD" }
        - { name: to, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD (exclusive)" }
        - { name: since, in: query, schema: { type: string }, description: "Go duration back from now, e.g. 24h, 720h" }
        - { name: group_by, in: query, schema: { type: string, enum: [tenant, slug, sandbox, run, day] } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/trace:
    get:
      tags: [accounting]
      summary: Event log across sandboxes (what a tenant's agents did)
      description: |
        Events of every sandbox matching the filter, oldest first: status changes, run
        lifecycle, user input and every gateway decision (`egress.allow` / `egress.deny`, data is
        an `Egress` object). `run.output` is excluded unless `type` lists it or is `all`.
        `stream=true` switches to SSE and keeps following live events after the replay;
        reconnect with `Last-Event-ID`.
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string }, description: "Comma-separated event types, or `all`" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: "Event id cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
        - { name: stream, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Page or stream
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        "200": { description: OK }
  /readyz:
    get:
      security: []
      summary: Readiness (the store answers)
      responses:
        "200": { description: Ready }
        "503": { description: "The store does not answer: this replica takes no traffic" }

  /agent/runs/next:
    get:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Long-poll for the next queued run of the calling sandbox
      parameters:
        - name: wait
          in: query
          schema: { type: string, default: 30s }
      responses:
        "200":
          description: A run, now marked running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "204": { description: Nothing queued within `wait` }
  /agent/runs/{run}/events:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Append output (one event per line of the body)
      description: |
        Limits: 4 MiB per request, 1 MiB per line. Lines up to the first violation are stored and
        the 413 message says how many (`stored N lines`), so a retry resumes after them. Lines
        that carry usage (Claude Code's `result`, generic `{"type":"usage"}`) update the run's accounting.

        Send `X-Batch-Id` (any id, kept across retries of the same batch): the server remembers how
        many lines of that batch it stored, records that before every response, and a retry skips
        them (`skipped` in the answer). Without it a retry after a lost response duplicates lines.
      parameters:
        - { name: X-Batch-Id, in: header, schema: { type: string, maxLength: 100 } }
      requestBody:
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer, description: "Lines of this batch stored in total" }
                  skipped: { type: integer, description: "Lines skipped because an earlier attempt stored them" }
        "413": { $ref: "#/components/responses/Error" }
  /agent/runs/{run}/input:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    get:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Long-poll for user input events addressed to this run
      description: |
        Returns `input` and `run.cancel` events with id > `after`, filtered in the store, so a
        run producing a lot of output cannot push them out of reach. Keep `after` at the id of the
        last event you received.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: wait, in: query, schema: { type: string, default: 30s } }
      responses:
        "200":
          description: Input events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /agent/runs/{run}/finish:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Mark the run finished
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exit_code: { type: integer }
                usage:
                  allOf: [{ $ref: "#/components/schemas/Usage" }]
                  description: Optional harness total; overrides what was parsed from the output stream
      responses:
        "204": { description: Recorded }

  /bootstrap:
    post:
      tags: [gateway]
      security: [{ bootstrapToken: [] }]
      summary: Issue the agent identity (called once by the init container)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr: { type: string, description: PEM certificate request; its subject is ignored }
      responses:
        "200":
          description: Certificate and instance number
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { type: integer }
                  slug: { type: string }
                  sandbox_id: { type: string }
                  tenant: { type: string }
                  cert: { type: string, description: PEM leaf certificate }
                  ca: { type: string, description: PEM agent CA root }
                  gateway_ca: { type: string, description: PEM root to trust for TLS to the gateway }
                  not_after: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
  /authz:
    get:
      tags: [gateway]
      security: []
      summary: Caddy forward_auth hook
      description: |
        Reads `X-Agent-Cert`, `X-Forwarded-Host`, `X-Forwarded-Method`, `X-Forwarded-Uri`.
        200 means allowed; response headers `Authorization`, `X-Api-Key`, `X-Agent-*` are copied
        onto the upstream request by Caddy. 403 otherwise.
      responses:
        "200": { description: Allowed }
        "403": { description: Denied }
  /crl.pem:
    get:
      tags: [gateway]
      security: []
      summary: CRL of retired, not yet expired agent certificates
      responses:
        "200":
          description: PEM CRL
          content:
            application/x-pem-file:
              schema: { type: string }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    mtls:
      type: mutualTLS
    bootstrapToken:
      type: http
      scheme: bearer
      description: Projected Kubernetes ServiceAccount token with audience `agent-sandbox`
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
    after:
      name: after
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page's `X-Next-Cursor`
    catalogName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    scope:
      name: tenant
      in: query
      schema: { type: string }
      description: "Admin only: the tenant scope to work in (empty = shared items). Tenant tokens are confined to their own scope and read shared items."
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 200 }
      description: |
        Repeating the request with the same key and body within 24h replays the stored 2xx response.
        409 while the first request is still running, 422 if the body differs.
  responses:
    Error:
      description: Error
      headers:
        X-Request-Id: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "No bearer token, or one that is unknown, revoked or expired (`bad token`); every authenticated route answers it"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ScopeForbidden:
      description: "The token is scoped to another tenant (a tenant principal named a tenant that is not its own)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CredentialsDisabled:
      description: "credentials.key is not configured on the server: the credentials API is off"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeysDisabled:
      description: "The server has no API key service"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human-readable message }
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, too_large, quota_exceeded, upstream_failed, invalid, internal, unavailable]
        request_id: { type: string }
    CreateSandbox:
      type: object
      required: [name, slug, owner]
      properties:
        name: { type: string, description: "Project name, DNS label; part of the preview host" }
        slug: { type: string, description: "Agent definition (harness config, skills, policy file)" }
        owner: { type: string, description: "User login" }
        tenant: { type: string, description: "Billing/secret scope; defaults to owner" }
        repo: { type: string, description: "Repository URL the agent works on" }
        idle_timeout: { type: integer, description: "Seconds without user activity before sleep; 0 = never", default: 3600 }
        wake_on_preview: { type: boolean, default: true }
        ttl: { type: integer, description: "Seconds until the sandbox is deleted (pod, volume; runs and events stay); absent/0 = keep. Capped at the token's expiry when oidc.ttl_from_token is on" }
        agent_version: { type: string, description: "Version name from the catalogue (tenants) or an image reference (admin); absent = default" }
        agent_ref: { type: string, description: "AgentDefinition reference: name, name@N, or shared/name[@N]. Supplies slug, repo, lifecycle defaults and the environment's launch; slug must then be absent or equal to the agent's policy" }
    UpdateSandbox:
      type: object
      description: Only the fields present are changed
      properties:
        repo: { type: string }
        idle_timeout: { type: integer }
        wake_on_preview: { type: boolean }
        ttl: { type: integer, description: "Seconds from now; 0 removes the expiry" }
    Sandbox:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        owner: { type: string }
        tenant: { type: string }
        repo: { type: string }
        idle_timeout: { type: integer }
        wake_on_preview: { type: boolean }
        status: { type: string, enum: [creating, waking, running, stopping, sleeping, deleting, error] }
        ip: { type: string }
        instance: { type: integer, description: "Current identity number; grows on every wake" }
        pod_name: { type: string }
        agent_version: { type: string, description: "Agent image the current (or last) pod runs" }
        agent_ref: { type: string, description: "AgentDefinition the sandbox was created from, with its scope: name, or shared/name (absent for bare-slug sandboxes)" }
        connections: { type: array, items: { type: string }, description: "Connections the agent uses, as references from the sandbox tenant's scope, fixed at creation; the gateway adds their headers to requests for their hosts" }
        agent_revision: { type: integer }
        environment_ref: { type: string }
        environment_revision: { type: integer }
        launch: { $ref: "#/components/schemas/Launch" }
        desired_version: { type: string, description: "Rollout target not yet applied; absent when none" }
        env_version: { type: string, description: "Fingerprint of policy content, harness command, image and pod environment at the last pod start" }
        revision: { type: integer, format: int64, description: "Changes on every update; every write is conditional on it (optimistic locking across replicas)" }
        last_activity: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: "Deleted after this time when set" }
        preview:
          type: object
          nullable: true
          properties:
            port: { type: integer }
            access: { type: string, enum: [link, sso, members] }
            host: { type: string }
        error: { type: string }
    Run:
      type: object
      properties:
        id: { type: string }
        sandbox_id: { type: string }
        tenant: { type: string, description: "Copied from the sandbox; survives its deletion" }
        slug: { type: string }
        task: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        exit_code: { type: integer }
        usage: { $ref: "#/components/schemas/Usage" }
        agent_version: { type: string, description: "Agent image that executed the run" }
        agent_ref: { type: string, description: "Catalogue revisions the run executed under, fixed when it was claimed" }
        agent_revision: { type: integer }
        environment_ref: { type: string }
        environment_revision: { type: integer }
        resume_of: { type: string, description: "The run this one continues: after a forced rollout (mode resume) or as the next message of the conversation (mode message)" }
        mode: { type: string, enum: ["", resume, message], description: "Empty: a fresh task; resume: continues resume_of after a rollout; message: the task is the next message of resume_of's session" }
        session: { type: string, description: "Harness conversation id captured from the output (Claude Code session_id, Codex thread_id)" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Launch:
      type: object
      description: The environment profile rendered at creation, kept on the sandbox; every pod of the sandbox starts with it
      properties:
        image: { type: string }
        mcp_servers:
          type: array
          description: "The MCP endpoints the agent's connections give it; exported to the pod as SANDBOX_MCP_SERVERS"
          items:
            type: object
            properties:
              name: { type: string, description: "The connection as the agent named it" }
              url: { type: string }
        harness_command: { type: string }
        harness_resume_command: { type: string }
        resume_prompt: { type: string }
        model: { type: string, description: "Exported as SANDBOX_MODEL and ANTHROPIC_MODEL" }
        instructions: { type: string, description: "Exported as SANDBOX_INSTRUCTIONS" }
        env: { type: object, additionalProperties: { type: string } }
        cpu_request: { type: string }
        cpu_limit: { type: string }
        memory_request: { type: string }
        memory_limit: { type: string }
        volume_size: { type: string }
        runtime_class: { type: string }
    CatalogItem:
      type: object
      description: One revision of a catalogue resource
      properties:
        kind: { type: string, enum: [AgentDefinition, EnvironmentProfile, Connection, PolicyBinding, TenantSettings, GitRepository] }
        tenant: { type: string, description: "Empty for shared items; the grantee for a PolicyBinding; the tenant for TenantSettings" }
        name: { type: string }
        revision: { type: integer }
        description: { type: string }
        spec:
          oneOf:
            - { $ref: "#/components/schemas/AgentSpec" }
            - { $ref: "#/components/schemas/EnvironmentSpec" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, description: "Set once the item was deleted; the revision stays as history and cannot be referenced" }
        source: { $ref: "#/components/schemas/Source" }
    GitRepositorySpec:
      type: object
      additionalProperties: false
      required: [url, ref, paths]
      properties:
        url: { type: string, description: "https URL of the repository, without user information (http for a loopback host only)" }
        ref: { type: string, description: "Branch or tag the platform follows; never a SHA" }
        paths: { type: array, items: { type: string }, minItems: 1, maxItems: 32, description: "Bundle files relative to the root; path patterns (*, ?, [...] within a segment) select several; applied in path order" }
        credential: { type: string, description: "Name of the secret that opens the repository (a token, or user:token): a tenant credential (BYOK) or an operator secret. Empty for a public repository. The same token posts pull request comments and statuses when the webhook is configured" }
        webhook_secret: { type: string, description: "Name of the secret the provider signs its webhook deliveries with. Empty: no webhook is accepted for this repository" }
    GitRepositoryDocument:
      type: object
      properties:
        kind: { type: string, enum: [GitRepository] }
        name: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/GitRepositorySpec" }
        expected_revision: { type: integer }
    CITrustSpec:
      type: object
      additionalProperties: false
      required: [issuer, audience, claims]
      properties:
        issuer: { type: string, description: "The token issuer exactly as its `iss` claim: https://token.actions.githubusercontent.com (GitHub Actions), the instance URL for GitLab or Forgejo; https, no trailing slash" }
        audience: { type: string, description: "The value the job requests its token for (`aud`); by convention the platform's URL. A token for another audience is refused" }
        claims: { type: object, additionalProperties: { type: string }, minProperties: 1, maxProperties: 16, description: "What the token must say, each claim exactly or as a pattern (*, ?, [...] within a segment): GitHub's repository and ref, GitLab's project_path and ref. A list claim matches on any entry. iss, aud, exp, nbf, iat and jti are not a trust's to name" }
        ttl: { type: string, description: "Lifetime of the key a matching job gets (default 15m, at least 1m, at most the server's ci_auth.max_ttl, one hour by default)" }
    CITrustDocument:
      type: object
      properties:
        kind: { type: string, enum: [CITrust] }
        name: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/CITrustSpec" }
        expected_revision: { type: integer }
    CIGrant:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          properties:
            secret: { type: string, description: "The key's secret (sbk_…), shown once; the key's `trust` names the CITrust that accepted the token" }
            subject: { type: string, description: "The token's sub claim (GitHub: repo:owner/name:ref:…; GitLab: project_path:…:ref_type:…:ref:…)" }
    GitSync:
      type: object
      description: The last check and the last sync of a GitRepository, as the platform saw them. The two halves are written independently (a check never touches the sync half and the other way round).
      properties:
        tenant: { type: string }
        name: { type: string }
        check:
          type: object
          description: The last check (absent until one ran)
          properties:
            head: { type: string, description: "The ref's head; empty when the check failed" }
            at: { type: string, format: date-time }
            error: { type: string, description: "Why the repository could not be read" }
        sync:
          type: object
          description: The last sync attempt (absent until one ran), the failed ones included
          properties:
            commit: { type: string, description: "The commit synced (or attempted)" }
            generation: { type: integer, description: "Counts the transitions of the desired state: moves on when a sync names another commit than the last one did, so a return to a commit synced before (a force push back) gets applies of its own; a repeat of the same commit finds its applies. Absent (0) for the first transition" }
            bundles:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  apply: { type: string, description: "The apply that wrote (or is writing) the bundle" }
                  status: { type: string, description: "The apply's status (done, failed, conflict, running), or invalid" }
                  changes: { type: integer, description: "Creates + updates of its plan" }
                  errors: { type: array, items: { type: string } }
            status: { type: string, enum: [running, done, invalid, stopped, error], description: "running: the transition (commit, generation) is fixed and the bundles are being applied, or that sync died before its summary. A sync that could not read the head keeps the transition on record (commit and generation) and records its error against it" }
            error: { type: string }
            at: { type: string, format: date-time }
        hook: { $ref: "#/components/schemas/GitHook" }
        updated_at: { type: string, format: date-time }
    GitHook:
      type: object
      description: The last webhook delivery handled for the repository
      properties:
        provider: { type: string, enum: [github, gitlab] }
        event: { type: string, description: "push, pull_request, merge_request, or the provider's name of an event the platform ignores" }
        action: { type: string, enum: [sync, plan, ignored] }
        reason: { type: string, description: "Why the delivery was ignored, how a redelivery was treated, or a note on how the action went (the head the ref or the request has moved to, the attempt that failed and when the next runs)" }
        ref: { type: string }
        commit: { type: string }
        number: { type: integer, description: "The pull or merge request number" }
        delivery: { type: string, description: "The provider's delivery id" }
        job: { type: string, description: "The persisted job carrying the action out (a redelivery names the same job)" }
        run: { type: integer, description: "The job's execution this outcome is from, counted for good (a redelivery that requeues the job starts attempts over, never runs); absent on the acceptance" }
        attempt: { type: integer, description: "That execution's number within the job's current budget of five; absent on the acceptance" }
        outcome: { type: string, enum: [done, invalid, stopped, error, ignored, superseded], description: "Absent while the action runs or waits for its next attempt; superseded: a delivery whose commit the ref or the pull request had already moved past, so nothing was written or published; error with a reason naming the next attempt: the job runs again" }
        error: { type: string }
        at: { type: string, format: date-time }
    GitSyncError:
      type: object
      description: A check or sync that did not succeed, with the record
      properties:
        error: { type: string }
        code: { type: string, enum: [unreachable, credential, invalid_plan, stopped, error] }
        sync: { $ref: "#/components/schemas/GitSync" }
    Credential:
      type: object
      description: Metadata of a secret a tenant brought through the API; the value is never part of it
      properties:
        tenant: { type: string, description: "Empty for the shared scope" }
        name: { type: string }
        version: { type: integer, description: "Bumped by every replacement" }
        fingerprint: { type: string, description: "First 12 hex of sha256(value)" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    APIKey:
      type: object
      description: A tenant API key; the secret is never part of it
      properties:
        id: { type: string, example: key_3f2a9c1e7b04 }
        tenant: { type: string }
        name: { type: string }
        created_by: { type: string, description: "The principal that issued it (admin-token, key:<id>, an OIDC subject)" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        rotated_to: { type: string, description: "The key that replaced this one" }
        last_used_at: { type: string, format: date-time, description: "Recorded at most once a minute" }
        trust: { type: string, description: "The CITrust that issued the key to a CI job (POST /v1/auth/ci); absent for a key a person or the admin created" }
    IssuedKey:
      allOf:
        - { $ref: "#/components/schemas/APIKey" }
        - type: object
          properties:
            secret: { type: string, description: "sbk_<id>_<random>: shown here and never again" }
            replaces: { type: string, description: "rotate only: the key this one replaces" }
    Source:
      type: object
      description: Provenance of a revision (set when an apply wrote it; absent on one written through this API), or of an apply's documents
      properties:
        apply: { type: string, description: "The apply that wrote the revision" }
        bundle: { type: string, description: "Fingerprint of the documents it applied" }
        repo: { type: string }
        ref: { type: string }
        commit: { type: string, description: "The commit the bundle file matched when applied" }
        path: { type: string }
        rollback: { type: string, description: "What the apply restored: an apply id or `Kind tenant/name@N`" }
    Drift:
      type: object
      properties:
        tenant: { type: string }
        checked: { type: integer, description: "Managed items examined" }
        at: { type: string, format: date-time }
        drifted:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              tenant: { type: string }
              name: { type: string }
              state: { type: string, enum: [changed, deleted] }
              applied: { $ref: "#/components/schemas/DriftRevision" }
              current: { $ref: "#/components/schemas/DriftRevision" }
              diff: { type: array, items: { $ref: "#/components/schemas/FieldChange" }, description: "applied → current" }
    DriftRevision:
      type: object
      properties:
        revision: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/Source" }
    Rollback:
      type: object
      properties:
        target: { type: string, description: "An apply id or `Kind tenant/name@N`" }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
        skipped:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              tenant: { type: string }
              name: { type: string }
              reason: { type: string }
        plan: { $ref: "#/components/schemas/Plan" }
        apply: { $ref: "#/components/schemas/Apply" }
    EnvironmentSpec:
      type: object
      required: [image]
      additionalProperties: false
      properties:
        image: { type: string, description: "Version name from the server catalogue; the admin may write an image reference" }
        harness:
          type: object
          additionalProperties: false
          properties:
            command: { type: string }
            resume_command: { type: string, description: "Continues a session: $SANDBOX_SESSION, the message (or the rollout prompt) in $SANDBOX_RESUME_PROMPT" }
            resume_prompt: { type: string, description: "What a rollout resume tells the harness (default: continue the task)" }
            input: { type: string, enum: [text, stream-json], description: "How messages reach the harness: a line on stdin, or Claude Code's streaming JSON input (keeps the conversation open)" }
            chat_idle: { type: integer, minimum: 0, description: "stream-json: seconds without a message after a turn before the runner closes the conversation (0 = 600)" }
        model:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, description: "Exported by the platform as SANDBOX_MODEL and ANTHROPIC_MODEL" }
            env: { type: object, additionalProperties: { type: string }, description: "Client settings such as ANTHROPIC_BASE_URL; platform names are refused" }
        resources:
          type: object
          additionalProperties: false
          description: "Kubernetes quantities, positive; a request must not exceed its limit. A request above the server's default limit raises that limit."
          properties:
            cpu_request: { type: string }
            cpu_limit: { type: string }
            memory_request: { type: string }
            memory_limit: { type: string }
            volume_size: { type: string }
        lifecycle:
          type: object
          additionalProperties: false
          properties:
            idle_timeout: { type: integer, minimum: 0 }
            ttl: { type: integer, minimum: 0 }
            wake_on_preview: { type: boolean }
        runtime_class: { type: string }
        env: { type: object, additionalProperties: { type: string }, description: "Agent container only; never shadows a platform or operator variable; platform names (SANDBOX_*, GATEWAY_IP, REGISTRAR_URL, API_URL, CERT_DIR, HOME, HARNESS_CMD, HARNESS_RESUME_CMD, GATEWAY_CA_FILE) are refused" }
    AgentSpec:
      type: object
      required: [policy, environment]
      additionalProperties: false
      properties:
        policy: { type: string, description: "Policy slug; the tenant must own it (admin may override)" }
        environment: { type: string, description: "EnvironmentProfile reference: name, name@N to pin, shared/name[@N] for a shared profile. A bare name is resolved (own scope, then shared) when the agent is written and stored in the resolved form, so a tenant profile created later under the same name does not capture it" }
        repo: { type: string }
        instructions: { type: string }
        connections: { type: array, items: { type: string }, description: "Connection references (name, or shared/name), resolved when the agent is written and stored in the resolved form; each must exist in the tenant's scope or among the shared ones" }
    EnvironmentDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [EnvironmentProfile] }
        tenant: { type: string, description: "Admin only: scope to write into (empty = shared)" }
        name: { type: string, description: "Must match the path when present" }
        description: { type: string }
        spec: { $ref: "#/components/schemas/EnvironmentSpec" }
        expected_revision: { type: integer, minimum: 0, description: "Conditional write: 0 = must not exist, N = latest must be N" }
    AgentDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [AgentDefinition] }
        tenant: { type: string }
        name: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        expected_revision: { type: integer, minimum: 0 }
    ConnectionSpec:
      type: object
      required: [type, host]
      additionalProperties: false
      properties:
        type: { type: string, enum: [http, mcp] }
        host: { type: string, description: "External host name (lower-case, no scheme or port). A host the policy repository serves takes headers only; any other host needs the tenant's settings to list it (admin shared connections: any host) and the connection is then its egress rule" }
        headers:
          type: object
          additionalProperties: { type: string }
          description: "Headers the gateway adds for agents using this connection. Values are templates: secret:NAME is resolved from the tenant's secrets at request time. A credential header (Authorization, Cookie, anything named like a key or token) must be a reference such as \"Bearer secret:NAME\"; a literal value is refused and never echoed"
        upstream: { type: string, description: "Self-service hosts only: where the gateway sends the traffic (http(s) URL; default https://<host>). Every live connection for a host must agree" }
        paths: { type: array, items: { type: string }, description: "Self-service hosts only: policy path patterns the agent may call (default /**)" }
        mcp:
          type: object
          additionalProperties: false
          description: "Self-service hosts of type mcp only: what the MCP proxy lets through (absent: every method and tool, the body is still inspected)"
          properties:
            read_only: { type: boolean }
            tools: { type: array, items: { type: string }, description: "Globs of tools/call names allowed when read_only" }
    ConnectionDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [Connection] }
        tenant: { type: string, description: "Admin only: scope to write into (empty = shared)" }
        name: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/ConnectionSpec" }
        expected_revision: { type: integer, minimum: 0 }
    PolicyBindingSpec:
      type: object
      additionalProperties: false
      properties:
        expires_at: { type: string, format: date-time, description: "The grant ends here; absent = until deleted" }
        max_sandboxes: { type: integer, minimum: 0, description: "Records the tenant may hold under this slug; 0 = tenant quota only" }
        max_awake: { type: integer, minimum: 0, description: "Pods at once under this slug" }
    PolicyBindingDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [PolicyBinding] }
        tenant: { type: string, description: "The grantee (or ?tenant=)" }
        name: { type: string, description: "The policy slug; must match the path" }
        description: { type: string }
        spec: { $ref: "#/components/schemas/PolicyBindingSpec" }
        expected_revision: { type: integer, minimum: 0 }
    TenantSettingsSpec:
      type: object
      additionalProperties: false
      properties:
        quota:
          type: object
          additionalProperties: false
          description: "Replaces the server's default quota for the tenant as a whole (0 = unlimited); absent = defaults"
          properties:
            max_sandboxes: { type: integer, minimum: 0 }
            max_awake: { type: integer, minimum: 0 }
        environments: { type: array, items: { type: string }, description: "Environment references the tenant's agents may use (name = its own, shared/name); empty = every visible one. Checked when an agent is written and when a sandbox is created" }
        hosts: { type: array, items: { type: string }, description: "Hosts the tenant may reach through its own connections beyond what the policy repository serves: exact names or *.suffix. Empty = none" }
    TenantSettingsDocument:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [TenantSettings] }
        tenant: { type: string, description: "Must match the path when present" }
        name: { type: string, enum: [settings] }
        description: { type: string }
        spec: { $ref: "#/components/schemas/TenantSettingsSpec" }
        expected_revision: { type: integer, minimum: 0 }
    Document:
      type: object
      required: [kind, spec]
      additionalProperties: false
      description: Any versioned resource document (the kind decides the spec schema)
      properties:
        kind: { type: string, enum: [AgentDefinition, EnvironmentProfile, Connection, PolicyBinding, TenantSettings, GitRepository] }
        tenant: { type: string }
        name: { type: string }
        description: { type: string }
        spec: { type: object }
        expected_revision: { type: integer, minimum: 0 }
    Plan:
      type: object
      properties:
        bundle: { type: string, description: "Fingerprint of the canonical documents (same files, same value)" }
        plan: { type: string, description: "Fingerprint of the plan: documents, scope, every change's action, expected and next revision. Apply takes it" }
        valid: { type: boolean }
        summary:
          type: object
          properties:
            create: { type: integer }
            update: { type: integer }
            noop: { type: integer }
            invalid: { type: integer }
        errors: { type: array, items: { type: string }, description: "Bundle-level problems (duplicates)" }
        changes:
          type: array
          description: In apply order (environments, connections, settings, bindings, agents), then by tenant and name
          items:
            type: object
            properties:
              kind: { type: string }
              tenant: { type: string }
              name: { type: string }
              action: { type: string, enum: [create, update, noop, invalid] }
              current_revision: { type: integer, description: "Live revision compared with (0 = none)" }
              expected_revision: { type: integer, description: "Revision apply must find for this change" }
              next_revision: { type: integer, description: "Revision the item will have after apply: the next number of its history (deleted revisions included) for create and update, the current one for noop. Pinned references in the bundle are checked against it" }
              resolved: { type: string, description: "Fingerprint of the item as apply will write it (canonical spec, references resolved). Part of the plan fingerprint: the same document resolving to another item is another plan" }
              diff:
                type: array
                description: Leaves of the canonical spec (and description) that differ, in path order
                items: { $ref: "#/components/schemas/FieldChange" }
              errors: { type: array, items: { type: string } }
    FieldChange:
      type: object
      properties:
        path: { type: string, example: spec.resources.cpu_limit }
        from: { description: "Absent when the field is added" }
        to: { description: "Absent when the field is removed" }
    Message:
      type: object
      description: One turn of a sandbox's conversation, derived from the event stream
      properties:
        id: { type: integer, format: int64, description: "The event it came from (resume with ?after=)" }
        run_id: { type: string }
        role: { type: string, enum: [user, assistant, tool, system, log] }
        text: { type: string }
        at: { type: string, format: date-time }
    FSEntry:
      type: object
      properties:
        path: { type: string, description: "Relative to /workspace" }
        type: { type: string, enum: [file, dir, symlink, other] }
        size: { type: integer, format: int64 }
        mod_time: { type: string, format: date-time }
    Apply:
      type: object
      description: One application of a bundle, continued by key
      properties:
        id: { type: string }
        key: { type: string }
        tenant: { type: string }
        admin: { type: boolean }
        subject: { type: string }
        bundle: { type: string }
        plan: { type: string }
        status: { type: string, enum: [running, done, failed, conflict] }
        error: { type: string, description: "Why it stopped" }
        steps:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              tenant: { type: string }
              name: { type: string }
              action: { type: string, enum: [create, update, noop] }
              expected_revision: { type: integer }
              next_revision: { type: integer }
              resolved: { type: string, description: "Fingerprint of the item as planned; a continuation refuses a step that would now resolve differently" }
              status: { type: string, enum: [pending, done, skipped, failed] }
              revision: { type: integer, description: "Written (done) or confirmed (skipped)" }
              error: { type: string }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
        source: { $ref: "#/components/schemas/Source" }
        lease_owner: { type: string }
        lease_until: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Usage:
      type: object
      description: |
        Model-side consumption of one run as reported by the harness. Claude Code's stream-json
        `result` line is parsed automatically; other harnesses print `{"type":"usage",...}` lines
        with these fields (added up) or send the total with `/agent/runs/{run}/finish`.
      properties:
        model: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        cost_usd: { type: number }
        turns: { type: integer }
    Egress:
      type: object
      description: Data of an egress.allow / egress.deny event
      properties:
        host: { type: string }
        method: { type: string }
        path: { type: string }
        code: { type: integer, description: "deny only: status answered to the agent" }
        reason: { type: string, description: "deny only" }
    Event:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sandbox_id: { type: string }
        tenant: { type: string }
        slug: { type: string }
        run_id: { type: string }
        type: { type: string, enum: [status, run.queued, run.started, run.output, run.finished, run.cancel, input, egress.allow, egress.deny, rollout] }
        data: { type: string, description: "status: new status; run.started: agent version; run.finished: final run status; egress.*: Egress JSON; rollout: {from, to, mode, run_id, resume_id}" }
        at: { type: string, format: date-time }
    UsageTotals:
      type: object
      properties:
        runs: { type: integer }
        runs_done: { type: integer }
        runs_failed: { type: integer }
        runs_cancelled: { type: integer }
        run_seconds: { type: number, description: "Sum of run wall time" }
        pod_seconds: { type: number, description: "Time sandbox pods were up (waking → stopping/sleeping/error)" }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        turns: { type: integer }
        egress_allowed: { type: integer, format: int64 }
        egress_denied: { type: integer, format: int64 }
        model_usd: { type: number, description: "As reported by the harness" }
        compute_usd: { type: number, description: "pod_seconds / 3600 × accounting.pod_hour_usd" }
        total_usd: { type: number }
    UsageReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string }
        pricing:
          type: object
          properties:
            pod_hour_usd: { type: number }
        total: { $ref: "#/components/schemas/UsageTotals" }
        rows:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  key: { type: string, description: "Group value (tenant, slug, sandbox id, run id or YYYY-MM-DD)" }
                  tenant: { type: string }
                  slug: { type: string }
                  sandbox_id: { type: string }
                  run_id: { type: string }
              - { $ref: "#/components/schemas/UsageTotals" }

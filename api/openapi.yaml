        "404": { $ref: "#/components/responses/Error" }
  /v1/citrusts:
    get:
      tags: [ci]
      summary: List the tenant's CITrusts (the admin with ?tenant=)
      description: |
        A CITrust lets CI jobs of one repository act as the tenant without a stored key: the
        issuer (the provider's token service), the audience the job requests its token for (the
        platform's URL), the claims the token must carry (the repository, the ref) and the ttl of
        the key an exchange issues. `POST /v1/auth/ci` exchanges a job's OIDC ID token for a key
        under the trust that accepts it. A trust is a grant: rollback never restores one.
      parameters: [{ $ref: "#/components/parameters/scope" }]

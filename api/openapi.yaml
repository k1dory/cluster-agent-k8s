openapi: 3.1.0
info:
  title: agent-sandbox control API
  version: 0.1.0
  description: |
    Control plane for isolated agent sandboxes. Clients (a UI, a CLI, CI) talk only to this API;
    Kubernetes, the gateway and identities are hidden behind it.

    Two audiences:
    * **Platform API** (`/v1/...`, port 8080): bearer token, used by your client. The admin token
      (`api_token`) sees every tenant; a tenant token (`api_tokens[]`) is confined to its tenant:
      creation forces the tenant, foreign sandboxes answer 403, lists, usage and trace are filtered.
    * **Agent API** (`/agent/...`, port 8081): reached by the agent pod through the mTLS gateway;
      identity comes from the client certificate that Caddy forwards in `X-Agent-Cert`.
      `/authz` and `/bootstrap` on the same port are called by Caddy and the init container.

    Contract notes:
    * **Errors** are always `{error, code, request_id}`; `code` is stable
      (`bad_request`, `unauthorized`, `forbidden`, `not_found`, `conflict`, `too_large`,
      `quota_exceeded`, `upstream_failed`, `internal`, `unavailable`). `request_id` also comes back
      as the `X-Request-Id` header and is in the server log; send your own `X-Request-Id` to correlate.
    * **Malformed query parameters are 400**, never silently defaulted.
    * **Paging**: list endpoints take `limit` and `after`. `X-Next-Cursor` is present only when
      another page exists (the server fetches one row more than `limit`); its value is opaque and
      keeps working after the anchor row is deleted or stops matching the filter. Event endpoints
      use the numeric event id as cursor.
    * **Idempotency**: `POST /v1/sandboxes` and `POST .../runs` honour `Idempotency-Key`. The key is
      reserved before the request runs: a concurrent repeat gets 409 with `Retry-After: 1`, a repeat
      with a different body gets 422, a repeat after success replays the stored response with
      `Idempotency-Replayed: true` (24h, per tenant and route).
    * Unknown routes and methods answer the same JSON error shape (404 / 405 with `Allow`).
servers:
  - url: http://localhost:8080
    description: platform API
security:
  - bearer: []
tags:
  - name: sandboxes
  - name: runs
  - name: events
  - name: preview
  - name: accounting
  - name: agent
  - name: gateway
paths:
  /v1/sandboxes:
    get:
      tags: [sandboxes]
      summary: List sandboxes
      parameters:
        - { name: tenant, in: query, schema: { type: string }, description: "Admin only; tenant tokens are scoped already" }
        - { name: owner, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [creating, waking, running, stopping, sleeping, deleting, error] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sandbox" }
    post:
      tags: [sandboxes]
      summary: Create a sandbox and start its first pod
      description: |
        The record is created first; if the cluster then refuses the volume or pod, you still get
        201 with `status: error` and the reason in `error`. The sandbox is yours to wake again or
        delete. Supports `Idempotency-Key`. A tenant token forces its tenant (403 for another).
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandbox" }
      responses:
        "201":
          description: Created (status is `waking` until the pod is ready, `error` if the cluster refused)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "Idempotency-Key request still in progress (Retry-After)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Idempotency-Key reused with a different body", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [sandboxes]
      summary: Get a sandbox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [sandboxes]
      summary: Change settings of a sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSandbox" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sandboxes]
      summary: Delete a sandbox, its pod and its volume
      description: |
        204 means pod, volume and record are gone. If the cluster refuses, the answer is 502 and
        the record stays with `status: deleting` and the reason in `error`; the server retries on
        its sweep and a repeated DELETE retries at once. Runs and events are kept for accounting.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/sleep:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Sleep now (delete the pod, keep the volume)
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Cancel a run in progress instead of refusing with 409.
      responses:
        "200":
          description: Sleeping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/wake:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Wake without a task (for example to serve the preview)
      responses:
        "200":
          description: Waking or already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
  /v1/sandboxes/{id}/touch:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Record user activity (postpones the idle timer)
      responses:
        "204": { description: Recorded }
  /v1/sandboxes/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [runs]
      summary: List runs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, done, failed, cancelled] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
    post:
      tags: [runs]
      summary: Queue a task for the agent; wakes a sleeping sandbox
      description: |
        The run is stored first. If waking the sandbox fails you still get 202: the run stays
        queued and starts on the next successful wake; the sandbox shows the failure. Supports
        `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, description: Task text handed to the harness }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/runs/{run}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    get:
      tags: [runs]
      summary: Get one run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/runs/{run}/cancel:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      summary: Cancel a queued or running run (the agent receives a run.cancel event and stops the harness)
      responses:
        "200":
          description: Cancelled (or already finished)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /v1/sandboxes/{id}/runs/{run}/input:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      summary: Send a user message to a queued or running run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "Non-empty; written to the harness stdin" }
      responses:
        "204": { description: Persisted in the event stream (a storage failure is a 500, never a silent 204) }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Run already finished", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/events:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [events]
      summary: Event stream (SSE) with replay, or a JSON page with stream=false
      description: |
        Default: `text/event-stream`, each message is `id: <event id>`, `event: <type>`, `data: <Event JSON>`.
        Pass `after` (or the `Last-Event-ID` header) to replay from the persisted log, `run` to see one run only.
        With `stream=false` the same filter returns a JSON array (up to `limit`, default 1000) and closes;
        a full page carries `X-Next-Cursor` (the last event id) for the next `after`.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: run, in: query, schema: { type: string } }
        - { name: stream, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, default: 1000 } }
      responses:
        "200":
          description: Stream or page
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /v1/sandboxes/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [preview]
      summary: Expose a port of the sandbox under a stable host name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port: { type: integer, description: "0 removes the preview" }
                access: { type: string, enum: [link, sso, members], default: members }
      responses:
        "200":
          description: Preview set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
  /v1/sandboxes/{id}/preview/ticket:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [preview]
      summary: Mint a short-lived sign-in ticket for the preview (your auth service checked the user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
                next: { type: string, description: "Path to open after sign-in; must start with /, default /" }
      responses:
        "200":
          description: Ticket and the callback URL to redirect the browser to (ticket and next are URL-escaped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  redirect: { type: string, format: uri }
        "409": { description: "Sandbox has no preview", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/whoami:
    get:
      tags: [sandboxes]
      summary: Who the token is
      responses:
        "200":
          description: Principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { type: boolean }
                  tenant: { type: string, description: "Empty for the admin token" }
  /openapi.yaml:
    get:
      security: []
      summary: This specification
      responses: { "200": { description: OpenAPI 3.1 YAML } }
  /docs:
    get:
      security: []
      summary: Swagger UI for this specification
      responses: { "200": { description: HTML } }
  /v1/policies:
    get:
      tags: [sandboxes]
      summary: Loaded egress policy slugs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /v1/usage:
    get:
      tags: [accounting]
      summary: Cost and consumption report
      description: |
        What was consumed in the window, filtered by tenant, agent slug, sandbox or run, and
        optionally grouped. Sources: model tokens and cost reported by the harness per run,
        run wall time, sandbox pod time (from status transitions, priced with
        `accounting.pod_hour_usd`), and gateway decisions (`egress_allowed` / `egress_denied`).
        Runs and events are kept when a sandbox is deleted, so history stays billable.
        Default window: the last 30 days.
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD" }
        - { name: to, in: query, schema: { type: string }, description: "RFC 3339 or YYYY-MM-DD (exclusive)" }
        - { name: since, in: query, schema: { type: string }, description: "Go duration back from now, e.g. 24h, 720h" }
        - { name: group_by, in: query, schema: { type: string, enum: [tenant, slug, sandbox, run, day] } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/trace:
    get:
      tags: [accounting]
      summary: Event log across sandboxes (what a tenant's agents did)
      description: |
        Events of every sandbox matching the filter, oldest first: status changes, run
        lifecycle, user input and every gateway decision (`egress.allow` / `egress.deny`, data is
        an `Egress` object). `run.output` is excluded unless `type` lists it or is `all`.
        `stream=true` switches to SSE and keeps following live events after the replay;
        reconnect with `Last-Event-ID`.
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: sandbox, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string }, description: "Comma-separated event types, or `all`" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: "Event id cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
        - { name: stream, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Page or stream
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      security: []
      summary: Liveness
      responses:
        "200": { description: OK }

  /agent/runs/next:
    get:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Long-poll for the next queued run of the calling sandbox
      parameters:
        - name: wait
          in: query
          schema: { type: string, default: 30s }
      responses:
        "200":
          description: A run, now marked running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "204": { description: Nothing queued within `wait` }
  /agent/runs/{run}/events:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Append output (one event per line of the body)
      description: |
        Limits: 4 MiB per request, 1 MiB per line. Lines up to the first violation are stored and
        the 413 message says how many (`stored N lines`), so a retry resumes after them. Lines
        that carry usage (Claude Code's `result`, generic `{"type":"usage"}`) update the run's accounting.

        Send `X-Batch-Id` (any id, kept across retries of the same batch): the server remembers how
        many lines of that batch it stored, records that before every response, and a retry skips
        them (`skipped` in the answer). Without it a retry after a lost response duplicates lines.
      parameters:
        - { name: X-Batch-Id, in: header, schema: { type: string, maxLength: 100 } }
      requestBody:
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer, description: "Lines of this batch stored in total" }
                  skipped: { type: integer, description: "Lines skipped because an earlier attempt stored them" }
        "413": { $ref: "#/components/responses/Error" }
  /agent/runs/{run}/input:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    get:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Long-poll for user input events addressed to this run
      description: |
        Returns `input` and `run.cancel` events with id > `after`, filtered in the store, so a
        run producing a lot of output cannot push them out of reach. Keep `after` at the id of the
        last event you received.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: wait, in: query, schema: { type: string, default: 30s } }
      responses:
        "200":
          description: Input events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /agent/runs/{run}/finish:
    parameters: [{ name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [agent]
      security: [{ mtls: [] }]
      summary: Mark the run finished
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exit_code: { type: integer }
                usage:
                  allOf: [{ $ref: "#/components/schemas/Usage" }]
                  description: Optional harness total; overrides what was parsed from the output stream
      responses:
        "204": { description: Recorded }

  /bootstrap:
    post:
      tags: [gateway]
      security: [{ bootstrapToken: [] }]
      summary: Issue the agent identity (called once by the init container)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr: { type: string, description: PEM certificate request; its subject is ignored }
      responses:
        "200":
          description: Certificate and instance number
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { type: integer }
                  slug: { type: string }
                  sandbox_id: { type: string }
                  tenant: { type: string }
                  cert: { type: string, description: PEM leaf certificate }
                  ca: { type: string, description: PEM agent CA root }
                  gateway_ca: { type: string, description: PEM root to trust for TLS to the gateway }
                  not_after: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
  /authz:
    get:
      tags: [gateway]
      security: []
      summary: Caddy forward_auth hook
      description: |
        Reads `X-Agent-Cert`, `X-Forwarded-Host`, `X-Forwarded-Method`, `X-Forwarded-Uri`.
        200 means allowed; response headers `Authorization`, `X-Api-Key`, `X-Agent-*` are copied
        onto the upstream request by Caddy. 403 otherwise.
      responses:
        "200": { description: Allowed }
        "403": { description: Denied }
  /crl.pem:
    get:
      tags: [gateway]
      security: []
      summary: CRL of retired, not yet expired agent certificates
      responses:
        "200":
          description: PEM CRL
          content:
            application/x-pem-file:
              schema: { type: string }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    mtls:
      type: mutualTLS
    bootstrapToken:
      type: http
      scheme: bearer
      description: Projected Kubernetes ServiceAccount token with audience `agent-sandbox`
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
    after:
      name: after
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous page's `X-Next-Cursor`
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 200 }
      description: |
        Repeating the request with the same key and body within 24h replays the stored 2xx response.
        409 while the first request is still running, 422 if the body differs.
  responses:
    Error:
      description: Error
      headers:
        X-Request-Id: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human-readable message }
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, too_large, quota_exceeded, upstream_failed, internal, unavailable]
        request_id: { type: string }
    CreateSandbox:
      type: object
      required: [name, slug, owner]
      properties:
        name: { type: string, description: "Project name, DNS label; part of the preview host" }
        slug: { type: string, description: "Agent definition (harness config, skills, policy file)" }
        owner: { type: string, description: "User login" }
        tenant: { type: string, description: "Billing/secret scope; defaults to owner" }
        repo: { type: string, description: "Repository URL the agent works on" }
        idle_timeout: { type: integer, description: "Seconds without user activity before sleep; 0 = never", default: 3600 }
        wake_on_preview: { type: boolean, default: true }
        ttl: { type: integer, description: "Seconds until the sandbox is deleted (pod, volume; runs and events stay); absent/0 = keep" }
    UpdateSandbox:
      type: object
      description: Only the fields present are changed
      properties:
        repo: { type: string }
        idle_timeout: { type: integer }
        wake_on_preview: { type: boolean }
        ttl: { type: integer, description: "Seconds from now; 0 removes the expiry" }
    Sandbox:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        owner: { type: string }
        tenant: { type: string }
        repo: { type: string }
        idle_timeout: { type: integer }
        wake_on_preview: { type: boolean }
        status: { type: string, enum: [creating, waking, running, stopping, sleeping, deleting, error] }
        ip: { type: string }
        instance: { type: integer, description: "Current identity number; grows on every wake" }
        pod_name: { type: string }
        last_activity: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: "Deleted after this time when set" }
        preview:
          type: object
          nullable: true
          properties:
            port: { type: integer }
            access: { type: string, enum: [link, sso, members] }
            host: { type: string }
        error: { type: string }
    Run:
      type: object
      properties:
        id: { type: string }
        sandbox_id: { type: string }
        tenant: { type: string, description: "Copied from the sandbox; survives its deletion" }
        slug: { type: string }
        task: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        exit_code: { type: integer }
        usage: { $ref: "#/components/schemas/Usage" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Usage:
      type: object
      description: |
        Model-side consumption of one run as reported by the harness. Claude Code's stream-json
        `result` line is parsed automatically; other harnesses print `{"type":"usage",...}` lines
        with these fields (added up) or send the total with `/agent/runs/{run}/finish`.
      properties:
        model: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        cost_usd: { type: number }
        turns: { type: integer }
    Egress:
      type: object
      description: Data of an egress.allow / egress.deny event
      properties:
        host: { type: string }
        method: { type: string }
        path: { type: string }
        code: { type: integer, description: "deny only: status answered to the agent" }
        reason: { type: string, description: "deny only" }
    Event:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sandbox_id: { type: string }
        tenant: { type: string }
        slug: { type: string }
        run_id: { type: string }
        type: { type: string, enum: [status, run.queued, run.started, run.output, run.finished, run.cancel, input, egress.allow, egress.deny] }
        data: { type: string, description: "status: new status; run.finished: final run status; egress.*: Egress JSON" }
        at: { type: string, format: date-time }
    UsageTotals:
      type: object
      properties:
        runs: { type: integer }
        runs_done: { type: integer }
        runs_failed: { type: integer }
        runs_cancelled: { type: integer }
        run_seconds: { type: number, description: "Sum of run wall time" }
        pod_seconds: { type: number, description: "Time sandbox pods were up (waking → stopping/sleeping/error)" }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        turns: { type: integer }
        egress_allowed: { type: integer, format: int64 }
        egress_denied: { type: integer, format: int64 }
        model_usd: { type: number, description: "As reported by the harness" }
        compute_usd: { type: number, description: "pod_seconds / 3600 × accounting.pod_hour_usd" }
        total_usd: { type: number }
    UsageReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string }
        pricing:
          type: object
          properties:
            pod_hour_usd: { type: number }
        total: { $ref: "#/components/schemas/UsageTotals" }
        rows:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  key: { type: string, description: "Group value (tenant, slug, sandbox id, run id or YYYY-MM-DD)" }
                  tenant: { type: string }
                  slug: { type: string }
                  sandbox_id: { type: string }
                  run_id: { type: string }
              - { $ref: "#/components/schemas/UsageTotals" }

openapi: 3.1.0
info:
  title: agent-sandbox control API
  version: 0.1.0
  description: |
    Control plane for isolated agent sandboxes. Clients (a UI, a CLI, CI) talk only to this API;
    Kubernetes, the gateway and identities are hidden behind it.

    Two audiences:
    * **Platform API** (`/v1/...`, port 8080): bearer token, used by your client. The admin token
      (`api_token`) sees every tenant; a tenant token (`api_tokens[]`) is confined to its tenant:
      creation forces the tenant, foreign sandboxes answer 403, lists, usage and trace are filtered.
      With `oidc` configured, a JWT from the identity provider is accepted too: the tenant comes
      from a claim, the admin role from another, and the token's expiry bounds the session (and,
      with `ttl_from_token`, the sandboxes and agent certificates it creates). `GET /v1/whoami`
      shows the resolved principal.
    * **Ownership.** A policy's `tenants` list says which tenants may create sandboxes (and roll out
      agents) with that slug; a slug outside the list answers 403.
    * **Catalogue.** `AgentDefinition`s (`/v1/agents`) and `EnvironmentProfile`s (`/v1/environments`)
      are versioned configuration per tenant (the admin also keeps shared ones, tenant ""). Every PUT
      appends a revision, `expected_revision` makes it conditional (409). Revision numbers are never
      reused: DELETE marks an item deleted and keeps its history at `/revisions`; a later PUT under
      the same name continues the numbering. References are "name", "name@N" (pinned) or
      "shared/name[@N]"; a bare name is resolved in the caller's scope first, then among the shared
      items, and stored in the form it resolved to, so the scope of a dependency is fixed when the
      document is written. `POST /v1/sandboxes` with `agent_ref` takes the policy, repository,
      lifecycle defaults and the environment's launch parameters from the catalogue; the sandbox
      records `agent_ref` / `environment_ref` (with the scope), `agent_revision`,
      `environment_revision` and the rendered `launch`, and every run records the revisions it ran
      under. A profile's `env` reaches the agent container only and cannot set platform names
      (`SANDBOX_*`, `GATEWAY_IP`, `REGISTRAR_URL`, `API_URL`, `CERT_DIR`, `HOME`, `HARNESS_CMD`,
      `HARNESS_RESUME_CMD`, `GATEWAY_CA_FILE`: 422). The same documents are accepted as YAML files
      by `sandboxctl apply` (several, separated by `---`, apply in order).
    * **Connections** (`/v1/connections`) name external services (HTTP APIs, MCP servers) with the
      headers the gateway adds; credentials are `secret:NAME` references resolved from the tenant's
      secrets provider at request time and never stored, returned or traced. Agents list the
      connections they use; a sandbox records them (`connections`) and the gateway adds their
      headers (under the policy's own injections) to every allowed request for their hosts, through
      forward_auth and the MCP proxy alike.
    * **PolicyBindings** (`/v1/bindings`, admin writes) grant a policy slug to a tenant at runtime,
      with an expiry and per-slug limits. Removing or expiring a binding revokes the slug: new
      sandboxes and wakes are refused, the gateway denies running agents at their next request and
      the reconciler stops their pods. **TenantSettings** (`/v1/tenants/{tenant}/settings`, admin
      writes) hold a tenant's quota and the environments its agents may use. Both are versioned
      like the catalogue and keep their history.
    * **Versions.** Every sandbox carries `agent_version` (the agent image its pod runs),
      `desired_version` (a rollout not yet applied) and `env_version` (fingerprint of policy content,
      harness command, image and pod environment the pod was started under). `GET /v1/version`
      lists the control plane build, the version catalogue and the current environment version per
      slug; `POST /v1/rollouts` moves agents between versions, with canary shares, deferred or forced
      updates and resume runs.
    * **Agent API** (`/agent/...`, port 8081): reached by the agent pod through the mTLS gateway;
      identity comes from the client certificate that Caddy forwards in `X-Agent-Cert`.
      `/authz` and `/bootstrap` on the same port are called by Caddy and the init container.

    Contract notes:
    * **Errors** are always `{error, code, request_id}`; `code` is stable
      (`bad_request`, `unauthorized`, `forbidden`, `not_found`, `conflict`, `too_large`,
      `quota_exceeded`, `upstream_failed`, `internal`, `unavailable`). `request_id` also comes back
      as the `X-Request-Id` header and is in the server log; send your own `X-Request-Id` to correlate.
    * **Malformed query parameters are 400**, never silently defaulted.
    * **Paging**: list endpoints take `limit` and `after`. `X-Next-Cursor` is present only when
      another page exists (the server fetches one row more than `limit`); its value is opaque and
      keeps working after the anchor row is deleted or stops matching the filter. Event endpoints
      use the numeric event id as cursor.
    * **Idempotency**: `POST /v1/sandboxes` and `POST .../runs` honour `Idempotency-Key`. The key is
      reserved before the request runs: a concurrent repeat gets 409 with `Retry-After: 1`, a repeat
      with a different body gets 422, a repeat after success replays the stored response with
      `Idempotency-Replayed: true` (24h, per tenant and route).
    * Unknown routes and methods answer the same JSON error shape (404 / 405 with `Allow`).
servers:
  - url: http://localhost:8080
    description: platform API
security:
  - bearer: []
tags:
  - name: sandboxes
  - name: catalogue
  - name: connections
  - name: tenancy
  - name: apply
  - name: rollouts
  - name: runs
  - name: conversation
  - name: files
  - name: events
  - name: preview
  - name: accounting
  - name: agent
  - name: gateway
paths:
  /v1/sandboxes:
    get:
      tags: [sandboxes]
      summary: List sandboxes
      parameters:
        - { name: tenant, in: query, schema: { type: string }, description: "Admin only; tenant tokens are scoped already" }
        - { name: owner, in: query, schema: { type: string } }
        - { name: slug, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [creating, waking, running, stopping, sleeping, deleting, error] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sandbox" }
    post:
      tags: [sandboxes]
      summary: Create a sandbox and start its first pod
      description: |
        The record is created first; if the cluster then refuses the volume or pod, you still get
        201 with `status: error` and the reason in `error`. The sandbox is yours to wake again or
        delete. Supports `Idempotency-Key`. A tenant token forces its tenant (403 for another).
        A tenant whose settings list allowed environments must create through `agent_ref`: the
        bare-slug path runs the server's default environment and answers 403 for such a tenant.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandbox" }
      responses:
        "201":
          description: Created (status is `waking` until the pod is ready, `error` if the cluster refused)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "Another tenant's scope; the tenant does not own the slug (policy list or binding); the environment is not allowed by the tenant settings, or a restricted tenant created by bare slug", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Idempotency-Key request still in progress (Retry-After)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Idempotency-Key reused with a different body", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [sandboxes]
      summary: Get a sandbox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [sandboxes]
      summary: Change settings of a sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSandbox" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sandboxes]
      summary: Delete a sandbox, its pod and its volume
      description: |
        204 means pod, volume and record are gone. If the cluster refuses, the answer is 502 and
        the record stays with `status: deleting` and the reason in `error`; the server retries on
        its sweep and a repeated DELETE retries at once. Runs and events are kept for accounting.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/sleep:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Sleep now (delete the pod, keep the volume)
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
          description: Cancel a run in progress instead of refusing with 409.
      responses:
        "200":
          description: Sleeping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/wake:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Wake without a task (for example to serve the preview)
      responses:
        "200":
          description: Waking or already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
  /v1/sandboxes/{id}/touch:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sandboxes]
      summary: Record user activity (postpones the idle timer)
      responses:
        "204": { description: Recorded }
  /v1/sandboxes/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [runs]
      summary: List runs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, done, failed, cancelled] } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
    post:
      tags: [runs]
      summary: Queue a task for the agent; wakes a sleeping sandbox
      description: |
        The run is stored first. If waking the sandbox fails you still get 202: the run stays
        queued and starts on the next successful wake; the sandbox shows the failure. Supports
        `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, description: Task text handed to the harness }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/runs/{run}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    get:
      tags: [runs]
      summary: Get one run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/runs/{run}/cancel:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      summary: Cancel a queued or running run (the agent receives a run.cancel event and stops the harness)
      responses:
        "200":
          description: Cancelled (or already finished)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /v1/sandboxes/{id}/runs/{run}/input:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: run, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      summary: Send a user message to a queued or running run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "Non-empty; written to the harness stdin" }
      responses:
        "204": { description: Persisted in the event stream (a storage failure is a 500, never a silent 204) }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Run already finished", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [conversation]
      summary: Send the next message of the conversation
      description: |
        A run in progress (or queued) receives the message as input (delivery `input`; with a
        stream-json harness it is answered in the same process). Otherwise a new run continues the
        latest harness session with the message as its prompt (`resumed`), or starts a fresh
        conversation when there is none (`new`). JSON `{text, attachments}` names workspace files
        already uploaded; multipart/form-data with a `text` field and `file` parts uploads each file
        to `uploads/<name>` first. Attached paths are listed after the text so the agent knows where
        to look. Supports `Idempotency-Key`.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                attachments: { type: array, items: { type: string }, description: "Workspace paths (relative to /workspace)" }
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string }
                file: { type: array, items: { type: string, format: binary } }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  delivery: { type: string, enum: [input, resumed, new] }
                  files: { type: array, items: { type: string }, description: "Workspace paths the attachments were written to" }
        "409": { description: "Sandbox is being deleted", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [conversation]
      summary: The conversation so far (one page)
      description: Turns derived from the event stream. `X-Next-Cursor` is the last event scanned; continue with `?after=`.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: "Event id to continue after" }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 }, description: "Events to scan" }
        - { name: raw, in: query, schema: { type: boolean, default: false }, description: "Also return harness output that is not a turn (role log)" }
      responses:
        "200":
          description: Turns
          headers: { X-Next-Cursor: { schema: { type: string } } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Message" } } } }
  /v1/sandboxes/{id}/messages/stream:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [conversation]
      summary: The conversation as server-sent events (replay after ?after or Last-Event-ID, then live)
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: raw, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: "text/event-stream; event = role, id = event id, data = Message" }
  /v1/sandboxes/{id}/messages/close:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [conversation]
      summary: End the open conversation
      description: The runner closes the harness's input (`run.close`); the harness exits and the run finishes with its result. The next message resumes the session in a new run.
      responses:
        "200": { description: The run being closed, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "409": { description: "No run in progress", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/runs/{run}/close:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [runs]
      summary: Close a run's conversation (a queued run is cancelled instead)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /v1/sandboxes/{id}/files:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [files]
      summary: List the workspace below a path
      description: |
        Performed by the agent pod on request (it is the only one that sees the volume), over the
        agent API. A sleeping sandbox is woken first unless `wake=false` (then 409). Paths are
        relative to /workspace; nothing outside it is reachable.
      parameters:
        - { name: path, in: query, schema: { type: string }, description: "Directory, relative to /workspace (default: the workspace root)" }
        - { name: depth, in: query, schema: { type: integer, default: 1, minimum: 1, maximum: 8 } }
        - { name: wake, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/FSEntry" } }
                  truncated: { type: boolean, description: "More than 5000 entries" }
        "404": { description: "No such directory", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Sandbox asleep and wake=false, or being deleted", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: "The pod did not answer in time", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/sandboxes/{id}/files/content:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [files]
      summary: Read a workspace file (up to 16 MiB)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: wake, in: query, schema: { type: boolean, default: true } }
      responses:
        "200": { description: "The file, with its detected Content-Type and X-File-Size" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { description: "File larger than 16 MiB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { $ref: "#/components/responses/Error" }
    put:
      tags: [files]
      summary: Write a workspace file (the request body, up to 16 MiB; parents are created)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: wake, in: query, schema: { type: boolean, default: true } }
      requestBody: { required: true, content: { "*/*": { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Written, content: { application/json: { schema: { type: object, properties: { path: { type: string }, size: { type: integer } } } } } }
        "413": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/events:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [events]
      summary: Event stream (SSE) with replay, or a JSON page with stream=false
      description: |
        Default: `text/event-stream`, each message is `id: <event id>`, `event: <type>`, `data: <Event JSON>`.
        Pass `after` (or the `Last-Event-ID` header) to replay from the persisted log, `run` to see one run only.
        With `stream=false` the same filter returns a JSON array (up to `limit`, default 1000) and closes;
        a full page carries `X-Next-Cursor` (the last event id) for the next `after`.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: run, in: query, schema: { type: string } }
        - { name: stream, in: query, schema: { type: boolean, default: true } }
        - { name: limit, in: query, schema: { type: integer, default: 1000 } }
      responses:
        "200":
          description: Stream or page
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /v1/sandboxes/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [preview]
      summary: Expose a port of the sandbox under a stable host name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port: { type: integer, description: "0 removes the preview" }
                access: { type: string, enum: [link, sso, members], default: members }
      responses:
        "200":
          description: Preview set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
  /v1/sandboxes/{id}/preview/ticket:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [preview]
      summary: Mint a short-lived sign-in ticket for the preview (your auth service checked the user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string }
                next: { type: string, description: "Path to open after sign-in; must start with /, default /" }
      responses:
        "200":
          description: Ticket and the callback URL to redirect the browser to (ticket and next are URL-escaped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  redirect: { type: string, format: uri }
        "409": { description: "Sandbox has no preview", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/agents:
    get:
      tags: [catalogue]
      summary: List AgentDefinitions visible in the scope (own + shared; admin picks a scope with ?tenant=)
      parameters: [{ $ref: "#/components/parameters/scope" }]
      responses:
        "200": { description: Latest revisions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
  /v1/agents/{name}:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [catalogue]
      summary: Get an AgentDefinition (latest, or ?revision=N)
      parameters: [{ name: revision, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [catalogue]
      summary: Create or update an AgentDefinition (appends a revision)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentDocument" }
      responses:
        "201": { description: Created (revision 1), content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "200": { description: New revision, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
        "403": { description: "The tenant does not own the policy, or wrote into another scope", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "expected_revision is not the latest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Invalid document (unknown field, trailing data after the document, unknown environment or policy)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [catalogue]
      summary: Delete an AgentDefinition (its revisions stay as history, marked deleted_at, and can no longer be referenced; existing sandboxes keep their launch; a later PUT continues the numbering)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{name}/revisions:

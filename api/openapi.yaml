        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [ci]
      summary: Register or update a CITrust (appends a revision)
      requestBody:
        required: true

  /v1/citrusts/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [ci]
      summary: History of a CITrust, oldest first, deleted revisions included
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ScopeForbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/gitrepos/{name}/check:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    post:
      tags: [git]
      summary: Resolve the ref and record its head (reachability, credential, ref)
      description: |
        Reads the repository with its credential and records the ref's head. The record comes
        back with the outcome: 200 with `head` set, 502 when the repository could not be read
        (unreachable, the credential refused, the ref missing; `check_error` says which), 422 when
        the credential named by the spec is not available any more. A tenant checks its own
        repositories; a shared repository is the admin's.
      responses:
        "200": { description: The ref resolved, content: { application/json: { schema: { $ref: "#/components/schemas/GitSync" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The token is scoped to another tenant (`forbidden`), or a tenant acting on a shared repository", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { description: "The credential named by the spec is not available (code `credential`, with the record)", content: { application/json: { schema: { $ref: "#/components/schemas/GitSyncError" } } } }
        "502": { description: "The repository could not be read (code `unreachable`, with the record)", content: { application/json: { schema: { $ref: "#/components/schemas/GitSyncError" } } } }
        "503": { description: "Git repositories are disabled", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/gitrepos/{name}/sync:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    post:
      tags: [git]
      summary: Apply the bundles of one commit (the ref's head by default)
      description: |
        Reads the bundle files at the commit (which must be the ref's head or reachable from it)
        and applies each through the apply controller under the key
        `git:<repository>@<commit>:<path>`, in path order, with the repository's authority (a
        tenant's repository does what the tenant may; the admin's shared repository what the admin
        may). Syncing the same commit again finds the same applies and writes nothing; a sync whose
        apply stopped is continued by syncing that commit again. The record comes back with the
        outcome and one entry per bundle (apply id, status, changes).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                commit: { type: string, pattern: "^[0-9a-f]{40}$", description: "A commit reachable from the ref; empty for the head" }
      responses:
        "200": { description: Every bundle applied, content: { application/json: { schema: { $ref: "#/components/schemas/GitSync" } } } }
        "400": { description: "Malformed body: not one JSON object (`null` included), `commit` not a string (`null` included), an unknown field, trailing data (code `bad_request`); nothing was read from Git", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The token is scoped to another tenant (`forbidden`), or a tenant acting on a shared repository", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "An apply did not finish (failed or conflict; code `stopped`, with the record): sync the same commit again once the cause is fixed", content: { application/json: { schema: { $ref: "#/components/schemas/GitSyncError" } } } }
        "413": { description: "Body over the limit (4096 bytes; code `too_large`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422":
          description: "A bundle is not valid, nothing of it written (code `invalid_plan`, with the record); the credential is not available (code `credential`, with the record); or `commit` is not a 40-digit SHA (code `invalid`, no record)"
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/GitSyncError" }
                  - { $ref: "#/components/schemas/Error" }
        "502": { description: "The repository could not be read: unreachable, credential refused, ref missing, commit not on the ref (code `unreachable`, with the record)", content: { application/json: { schema: { $ref: "#/components/schemas/GitSyncError" } } } }
        "503": { description: "Git repositories are disabled", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/gitrepos/{name}/status:
    parameters: [{ $ref: "#/components/parameters/catalogName" }, { $ref: "#/components/parameters/scope" }]
    get:
      tags: [git]
      summary: The last check and the last sync of a GitRepository
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GitSync" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The token is scoped to another tenant (`forbidden`), or a tenant reading a shared repository's status", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "Unknown repository, or never checked nor synced", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Git repositories are disabled", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /hooks/git/{tenant}/{name}:
    post:
      tags: [git]
      summary: A GitHub or GitLab webhook delivery for a registered GitRepository (no bearer token)
      description: |
        The provider tells the platform what happened and the platform does what the CI templates
        would, with nothing installed in the repository but the webhook: a push to the followed
        ref syncs its head (`action: sync`); an opened, updated or reopened pull (merge) request
        gets the plan of its head as one comment (updated per push, found by the marker line) and
        a commit status `agent-sandbox/plan` (`action: plan`); anything else is recorded as
        ignored with the reason. The delivery is authenticated by its signature against the
        repository's `webhook_secret` (GitHub `X-Hub-Signature-256`, GitLab `X-Gitlab-Token`) and
        must name the registered repository. The action is a persisted job: one per delivery (a
        redelivery names the same job), claimed by one replica at a time under a lease and taken
        over by another when that replica dies; it runs with the repository's authority, under the
        tenant's cross-replica lock (syncs and plans alike), and its outcome lands in the `hook`
        half of the status. A job acts on what the repository holds now: a push syncs the ref's
        current head and a pull request plan is published for the request's current head only, so a
        delivery handled late cannot roll a newer state back or land an older plan over a newer one
        (`superseded`). A job whose work is unfinished (an error, or a stopped apply, which is then
        continued; not an invalid bundle) runs again after 30s, 1m, 2m and 4m, five attempts in all,
        then fails; one that runs out of its lease is taken over, up to the same five attempts. A redelivery of a delivery whose job ran reports its
        outcome and changes nothing; of one whose job failed or waits for its next attempt, runs it
        again now; of one due or running, names it.
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string }, description: "The repository's tenant; `-` for the shared scope" }
        - { $ref: "#/components/parameters/catalogName" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's payload, as sent" }
      responses:
        "202": { description: The platform acts on the delivery (sync or plan started), content: { application/json: { schema: { $ref: "#/components/schemas/GitHook" } } } }
        "200": { description: Recorded as ignored (`reason` says why), content: { application/json: { schema: { $ref: "#/components/schemas/GitHook" } } } }
        "400": { description: "No provider header, or a payload that does not parse", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "The signature does not match the repository's webhook secret", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "No such repository, or one without a `webhook_secret`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: "Payload over 2 MiB", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Git repositories are disabled, or the webhook secret cannot be resolved", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/auth/ci:
    post:
      tags: [ci]
      summary: Exchange a CI provider's OIDC ID token for a short-lived tenant key (no bearer token)
      description: |
        The job presents the ID token its provider issued to it for this run (GitHub Actions'
        `ACTIONS_ID_TOKEN_REQUEST_URL`, GitLab's `id_tokens:`, a Forgejo that issues them). The
        platform verifies the token's signature, issuer and expiry against the issuer's published
        keys, finds the one tenant whose CITrust names that issuer, carries the token's audience and
        matches its claims, uses the token once (its `jti`), and issues a key of that tenant that
        expires in the trust's `ttl`. The key is an ordinary tenant key (`sbk_…`): `keys list` shows
        it with `trust` set; it is pruned once long expired. A refusal says nothing about which
        trusts exist. `sandboxctl auth ci -token … | -github` wraps the call.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, description: "The provider's ID token (a signed JWT, at most 16 KiB)" }
      responses:
        "201":
          description: The key, its secret (shown once), the trust that matched and the token's subject
          content: { application/json: { schema: { $ref: "#/components/schemas/CIGrant" } } }
        "400": { description: "The body is not one JSON object with `token`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "No CITrust accepts the token (unknown issuer, another audience, claims that match no trust, expired, already exchanged, two tenants' trusts matching)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "CI authentication is disabled, or the issuer's keys could not be fetched", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bindings:
    get:
      tags: [tenancy]
      summary: List a tenant's PolicyBindings (a tenant its own; the admin with ?tenant=)
      parameters: [{ $ref: "#/components/parameters/scope" }]

# EnvironmentProfile: everything about how an agent pod runs, except the task.
# Apply:  sandboxctl apply -f examples/catalog/environment-python.yaml
# Every apply appends a revision; sandboxes keep the revision they were created from.
kind: EnvironmentProfile
name: python-dev
description: Python service work on Claude Code, 20 GiB workspace, sleeps after 30 minutes
spec:
  image: stable                     # a version name from the server's catalogue (`sandboxctl version`);
                                    # the admin may write an image reference instead
  harness:
    command: 'claude -p "$SANDBOX_TASK" --output-format stream-json --verbose'
    resume_command: 'claude -p "$SANDBOX_RESUME_PROMPT" --resume "$SANDBOX_SESSION" --output-format stream-json --verbose'
  model:
    name: claude-opus-5-5           # exported to the pod as SANDBOX_MODEL and ANTHROPIC_MODEL
    env:
      ANTHROPIC_BASE_URL: https://api.anthropic.com
  resources:                        # positive quantities; a request may not exceed its limit
    cpu_request: 500m
    cpu_limit: "2"
    memory_request: 2Gi
    memory_limit: 6Gi
    volume_size: 20Gi
  lifecycle:
    idle_timeout: 1800              # seconds without activity before the pod sleeps (0 = never)
    ttl: 0                          # seconds until the sandbox is deleted (0 = keep)
    wake_on_preview: true
  env:                              # agent container only; SANDBOX_*, GATEWAY_IP, API_URL... are the platform's
    PIP_INDEX_URL: https://pypi.example.com/simple

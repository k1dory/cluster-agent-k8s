# Expectations for the example policies (`sandboxd policy test examples/policies -f
# examples/policies/tests.yaml`, part of make ci-policy). Same format as policies/tests.yaml.
- slug: llm-subscriptions
  allow:
    - POST api.anthropic.com/v1/messages?beta=true
    - POST api.anthropic.com/v1/messages/count_tokens
    - GET  api.anthropic.com/v1/models
  deny:
    - GET  api.anthropic.com/api/oauth/profile     # account endpoints are not the agent's business
    - POST claude.ai/api/organizations
    - GET  evil.example.com/

<!-- ===================== STAGE A ===================== -->
<g id="stageA" style="transform-box:view-box;transform-origin:1220px 540px">

  <g id="deny" data-a>

  <!-- left column -->

    <rect x="160" y="200" width="420" height="130" class="card" stroke="#C3E88D"/>

    <text x="190" y="584" class="t3" style="font-size:22px">pushes to agent/docs-writer-5</text>

  </g>

    <rect x="160" y="700" width="420" height="130" class="card" stroke="#C3E88D"/>
    <text x="190" y="746" class="h" style="font-size:26px">backend-dev <tspan class="mono num">/ 8</tspan></text>
    <text x="190" y="784" class="t2" style="font-size:24px">takes task TV-311</text>
    <text x="190" y="814" class="t3" style="font-size:22px">the tracker called POST /runs</text>

  </g>

    <text x="190" y="883" class="t3" style="font-size:22px">task tracker → API → run queued</text>
  </g>

  <!-- right column -->
  <g id="f4" data-a>
    <rect x="1340" y="200" width="420" height="130" class="card" stroke="#C3E88D"/>
    <text x="1370" y="246" class="h" style="font-size:26px">frontend-dev <tspan class="mono num">/ 6</tspan></text>
    <text x="1370" y="284" class="t2" style="font-size:24px">vite listens on 0.0.0.0:3000</text>
    <text x="1370" y="314" class="t3" style="font-size:22px">preview: shop-alice.preview…</text>
    <path d="M1340 265 C 1220 265, 1180 500, 1110 520" class="wire"/>
  </g>
  <g id="browser" data-a>
    <rect x="1340" y="345" width="420" height="60" rx="8" fill="#16181D" stroke="#2A2E37" stroke-width="2" stroke-dasharray="6 4"/>

  </g>
  <g id="f5" data-a>
    <rect x="1340" y="470" width="420" height="130" class="card" stroke="#C3E88D"/>

<g id="end">

  <g id="e1" data-a><text x="960" y="530" text-anchor="middle" class="t2" style="font-size:36px">Identity in the certificate.</text></g>
  <g id="e2" data-a><text x="960" y="590" text-anchor="middle" class="t2" style="font-size:36px">Rules in git.</text></g>
  <g id="e3" data-a><text x="960" y="650" text-anchor="middle" class="t2" style="font-size:36px">One exit, for every agent.</text></g>
  <g id="e4" data-a><text x="960" y="740" text-anchor="middle" class="mono t3" style="font-size:24px">github.com/k1dory/cluster-agent</text></g>
</g>

<!-- ===================== CAPTIONS ===================== -->
<g id="caps">
  <line x1="100" y1="925" x2="1820" y2="925" stroke="#1E2127" stroke-width="2"/>
  <g id="c1" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">1</tspan>  A task arrives through the API.</text><text x="100" y="1030" class="sub">That is the only way in. No SSH, no shell, no UI inside the sandbox.</text></g>
  <g id="c2" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">2</tspan>  sandboxd starts a pod with one network interface.</text><text x="100" y="1030" class="sub">It leads to the gateway and nowhere else. The pod gets a certificate: who it is, not what it may do.</text></g>
  <g id="c3" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">3</tspan>  The agent calls an MCP server.</text><text x="100" y="1030" class="sub">The gateway reads the certificate, finds the slug's policy, matches host and path. Allowed.</text></g>
  <g id="c4" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">3</tspan>  The agent pushes to Git.</text><text x="100" y="1030" class="sub">Allowed, and the gateway adds the token itself. The agent never holds a secret.</text></g>
  <g id="c5" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">3</tspan>  The agent tries somewhere else.</text><text x="100" y="1030" class="sub">No rule, no route. Everything is logged with the agent's identity.</text></g>
  <g id="c6" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">4</tspan>  Zoom out: many pods, one gateway, one policy repository.</text><text x="100" y="1030" class="sub">Each pod carries its own number and answers to the same rules.</text></g>
  <g id="c7" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">4</tspan>  An hour without the user: the pod is deleted, its disk stays.</text><text x="100" y="1030" class="sub">The next task wakes a new pod with the next number. Old certificates stay dead.</text></g>
  <g id="c8" data-a><text x="100" y="985" class="cap"><tspan class="fn mono">4</tspan>  …and more. Up to 124 pods per VLAN, one gateway for all of them.</text><text x="100" y="1030" class="sub">Adding a pod is an API call. Adding a host is a line in a policy file. Nothing else changes.</text></g>
</g>
</svg>

<script>
// ---------- tiny deterministic timeline engine ----------
const tracks = [];
const $ = id => document.getElementById(id);
const ease = t => 1 - Math.pow(1 - t, 3);
const lerp = (a, b, t) => a + (b - a) * t;
function add(id, at, dur, props) { tracks.push({ el: $(id), at: at * 1000, dur: dur * 1000, props }); }
const show = (id, at, dur = .5) => add(id, at, dur, { opacity: [0, 1], scale: [.96, 1] });
const hide = (id, at, dur = .5) => add(id, at, dur, { opacity: [1, 0] });
function along(id, pathId, at, dur, from = 0, to = 1) { tracks.push({ el: $(id), path: $(pathId), at: at * 1000, dur: dur * 1000, from, to }); }
function type(id, text, at, dur) { tracks.push({ el: $(id), text, at: at * 1000, dur: dur * 1000 }); }
function light(id, at, dur = .4) { tracks.push({ el: $(id).querySelector('rect'), at: at * 1000, dur: dur * 1000, props: { opacity: [0, .18] } }); }
function unlight(id, at, dur = .4) { tracks.push({ el: $(id).querySelector('rect'), at: at * 1000, dur: dur * 1000, props: { opacity: [.18, 0] } }); }
function dim(id, at, dur, to) { add(id, at, dur, { opacity: [1, to] }); }

tracks.sort((a, b) => a.at - b.at);
const state = new Map();
function seek(ms) {
  // defaults
  for (const el of document.querySelectorAll('[data-a]')) { el.style.opacity = 0; el.style.transform = ''; }
  for (const id of ['stageA', 'stageB', 'caps']) { $(id).style.opacity = 1; $(id).style.transform = ''; }
  for (const r of document.querySelectorAll('#policy g > rect')) r.style.opacity = 0;
  for (const g of ['pl1','pl2','pl3','pl4','pl5','v0','f5s']) $(g).style.opacity = 1;
  const pos = new Map();
  for (const tr of tracks) {
    if (ms < tr.at) continue;
    const t = tr.dur > 0 ? Math.min(1, (ms - tr.at) / tr.dur) : 1;
    const k = ease(t);
    if (tr.text !== undefined) { tr.el.textContent = tr.text.slice(0, Math.round(tr.text.length * t)); continue; }
    if (tr.path) {
      const L = tr.path.getTotalLength();
      const p = tr.path.getPointAtLength(L * lerp(tr.from, tr.to, k));
      pos.set(tr.el, p);
      continue;
    }
    const cur = state.get(tr.el) || {};
    for (const [prop, [a, b]] of Object.entries(tr.props)) cur[prop] = lerp(a, b, k);
    state.set(tr.el, cur);
  }
  for (const [el, cur] of state) {
    if (cur.opacity !== undefined) el.style.opacity = cur.opacity;
    const p = pos.get(el);
    const tx = p ? p.x : (cur.x || 0), ty = p ? p.y : (cur.y || 0);
    const s = cur.scale !== undefined ? cur.scale : 1;
    if (p || s !== 1 || tx || ty) el.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }
  for (const [el, p] of pos) if (!state.has(el)) el.style.transform = `translate(${p.x}px, ${p.y}px)`;
  state.clear();
  // text tracks before their start must be empty
  for (const tr of tracks) if (tr.text !== undefined && ms < tr.at) tr.el.textContent = '';
}
window.seek = seek;
window.DURATION_MS = 56000;
// live preview in a browser tab
if (!navigator.webdriver) { const t0 = performance.now(); (function loop(){ seek((performance.now() - t0) % window.DURATION_MS); requestAnimationFrame(loop); })(); }

# The product CI under the shared contract (docs/ci-contract.md): every check is a Make target
# (`make ci-<group>`, implemented once in the Makefile and hack/ci), and this file only selects
# events, arranges the jobs, prepares the runner's tools and services, maps the runner's context
# to the targets' explicit inputs and calls them. .forgejo/workflows/ci.yaml and .gitlab-ci.yml
# call the same targets; `make ci` runs the whole required set on a developer's machine.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  versions:
    # The matrices and service versions, read from hack/ci/versions.env (the one definition)
    # instead of being copied into this file.
    runs-on: ubuntu-latest
    outputs:
      caddy: ${{ steps.v.outputs.caddy }}
      postgres: ${{ steps.v.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: hack/ci/versions.sh github >> "$GITHUB_OUTPUT"
  unit:
    # Build, formatting and vet, every regression test under the race detector, the policy gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-build
      - run: make ci-vet
      - run: make ci-unit
      - run: make ci-policy
  postgres:
    # The store and Git job contracts on a real PostgreSQL; the service is mapped to the
    # target's input, SANDBOX_TEST_POSTGRES_URL.
    needs: versions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.versions.outputs.postgres }}
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sandbox" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-postgres
        env:
          SANDBOX_TEST_POSTGRES_URL: postgres://sandbox:sandbox@127.0.0.1:5432/sandbox_test?sslmode=disable
  caddy:
    # The gateway on a real Caddy, one job per supported version (the target downloads it).
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        caddy: ${{ fromJSON(needs.versions.outputs.caddy) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-caddy CADDY_VERSION=${{ matrix.caddy }}
  helm:
    # Chart lint and the rendered manifests (the target downloads the pinned Helm).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make ci-helm
  images:
    # The three images and what they carry, on the runner's Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make ci-images
  git-adapter-e2e:
    # The Git adapters on a real runner: plan → merge → SHA → drift → guarded re-run → dirty
    # refusal → GitLab jobs, from the images.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make ci-e2e-git

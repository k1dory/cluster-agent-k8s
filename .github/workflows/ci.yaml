# Build, vet, unit tests, policy gate, chart lint, and the gateway path on a real Caddy for
# every supported Caddy minor (the gateway configuration is generated for Caddy 2.8+:
# trust_pool inline needs 2.8, Caddy 1 is end of life).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./... && test -z "$(gofmt -l .)"
      # Every regression test, under the race detector: the apply controller, the chat
      # continuity and the store contract on the in-memory store run here on every PR.
      - run: go test ./... -count=1 -race
      - run: go run ./cmd/sandboxd policy validate policies
      - run: go run ./cmd/sandboxd policy test policies -f policies/tests.yaml
  postgres:
    # The store contract on a real PostgreSQL: fresh schema, upgrade from earlier schemas,
    # concurrent writers across two pools, revision numbers never reused, apply steps that
    # refuse a stale noop or a changed history. SANDBOX_TEST_REQUIRE_EXTERNAL turns the
    # "no database configured" skip into a failure so a broken service cannot pass silently.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sandbox" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/store/ -count=1 -race -v
        env:
          SANDBOX_TEST_POSTGRES_URL: postgres://sandbox:sandbox@127.0.0.1:5432/sandbox_test?sslmode=disable
          SANDBOX_TEST_REQUIRE_EXTERNAL: "1"
  caddy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        caddy: ["2.8.4", "2.9.1", "2.10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install caddy ${{ matrix.caddy }}
        run: |
          curl -sSfL -o /tmp/caddy.tgz "https://github.com/caddyserver/caddy/releases/download/v${{ matrix.caddy }}/caddy_${{ matrix.caddy }}_linux_amd64.tar.gz"
          tar -C /tmp -xzf /tmp/caddy.tgz caddy
          /tmp/caddy version
      - name: gateway end to end (render, push, bootstrap, mTLS, policy, injection, agent API)
        run: CADDY_BIN=/tmp/caddy SANDBOX_TEST_REQUIRE_EXTERNAL=1 go test ./internal/integration/ -count=1 -v
      - name: the rendered Caddyfile also passes `caddy validate`
        run: |
          cat > /tmp/render.yaml <<CFG
          policies_dir: policies
          ca: { dir: /tmp/ca }
          runtime: fake
          gateway: { ip: 10.77.77.1, caddy_admin: "http://127.0.0.1:2019" }
          preview: { domain: preview.example.com }
          CFG
          go run ./cmd/sandboxd policy render -config /tmp/render.yaml > /tmp/Caddyfile
          /tmp/caddy validate --adapter caddyfile --config /tmp/Caddyfile
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: make helm-lint
      - name: rendered manifests are up to date
        run: make manifests && git diff --exit-code deploy/k8s
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the agent image
        run: docker build -f images/agent/Dockerfile -t agent-sandbox/agent:ci .
      - name: build the control plane image
        run: docker build -f images/sandboxd/Dockerfile -t agent-sandbox/sandboxd:ci .
      - name: build the sandboxctl image for CI jobs (the Git adapters) and run it once
        run: |
          docker build -f images/sandboxd/Dockerfile --target sandboxctl -t agent-sandbox/sandboxctl:ci .
          docker run --rm agent-sandbox/sandboxctl:ci 2>&1 | head -3
          docker run --rm --entrypoint sh agent-sandbox/sandboxctl:ci -c 'command -v curl jq git >/dev/null && echo tools-present'
      - name: the image reads a checkout owned by another user (the CI case) and records its SHA
        run: |
          # The runner's checkout is owned by the runner, the image runs as uid 1000: without the
          # image's safe.directory Git refuses it, and apply would have no commit to record.
          test "$(stat -c %u .)" != 1000
          docker run --rm -v "$PWD:/w" -w /w --entrypoint git agent-sandbox/sandboxctl:ci rev-parse HEAD | grep -qx "$GITHUB_SHA"
          # apply -require-commit reads the source before it asks the platform: with none
          # reachable, a clean checkout fails at the request (exit 1, a marker block, no
          # -require-commit complaint); a modified file fails on the missing SHA.
          ctl() { docker run --rm -v "$PWD:/w" -w /w -e SANDBOXD_URL=http://127.0.0.1:9 -e SANDBOXD_TOKEN=x agent-sandbox/sandboxctl:ci "$@" 2>&1; }
          set +e
          out=$(ctl apply -f examples/catalog/bundle.yaml -require-commit -markdown); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q '<!-- agent-sandbox -->' && ! echo "$out" | grep -q 'require-commit' || exit 1
          echo "# touched" >> examples/catalog/bundle.yaml
          out=$(ctl apply -f examples/catalog/bundle.yaml -require-commit -markdown); code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q 'require-commit: no commit SHA' || exit 1
          git checkout -- examples/catalog/bundle.yaml
      - name: smoke test the shipped agent image (user, tools, netlock, agent-init, agent-runner)
        run: hack/smoke-image.sh agent-sandbox/agent:ci
      - name: network lock on an isolated Docker network (pod ↔ pod denied, gateway ↔ pod allowed both ways)
        run: python3 hack/test-netlock.py agent-sandbox/agent:ci

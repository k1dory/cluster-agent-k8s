# Policy-as-Code gate on its own: every change to policies/ must validate, pass the expectations
# and render a gateway configuration Caddy accepts. The same target as the `unit` job of ci.yaml
# runs (`make ci-policy`, docs/ci-contract.md); this workflow only triggers it on the paths.
name: policies
on:
  pull_request:
    paths: ["policies/**", "internal/policy/**", "internal/gateway/**"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci-policy

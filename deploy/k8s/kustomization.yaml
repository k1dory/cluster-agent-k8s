apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-sandbox
resources:
  - gateway-on-node.yaml
# Policies are inside gateway-on-node.yaml (ConfigMap agent-sandbox-sandboxd-policies); `make manifests`
# regenerates them from policies/. Override images here instead of editing the rendered file.
images:
  - name: registry.example.com/agent-sandbox/sandboxd
    newName: registry.example.com/agent-sandbox/sandboxd
    newTag: latest

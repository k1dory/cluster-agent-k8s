# Create with real values (openssl rand -hex 32) and apply before the manifests. Never commit the filled file.
apiVersion: v1
kind: Secret
metadata:
  name: agent-sandbox-secrets
  namespace: agent-sandbox
type: Opaque
stringData:
  SANDBOXD_API_TOKEN: change-me
  PREVIEW_TICKET_KEY: change-me
  DATABASE_URL: postgres://sandbox:change-me@postgres.agent-sandbox.svc:5432/sandbox?sslmode=disable

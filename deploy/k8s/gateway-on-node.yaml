---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-sandboxd
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
---
# Identity of agent pods. No RBAC at all: the projected token is only a bootstrap credential
# that the Registrar verifies with TokenReview.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-sandboxd-config
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
data:
  Caddyfile.bootstrap: |
    {
    	skip_install_trust
    	admin 127.0.0.1:2019
    }
  sandboxd.yaml: |
    listen:
      api: ":8080"
      gateway: "127.0.0.1:8081"
      ingress: "127.0.0.1:8082"
    api_token: "${SANDBOXD_API_TOKEN}"
    api_keys:
      max_ttl: "0"
    database_url: "${DATABASE_URL}"
    policies_dir: /etc/sandbox/policies
    policies_strict: false
    ca:
      dir: /var/lib/sandboxd/ca
      source: file
      cert_ttl: 168h
    agent:
      default: ""
      versions:
    gateway:
      ip: 10.77.77.1
      caddy_admin: http://127.0.0.1:2019
      caddyfile_out: /var/lib/sandboxd/Caddyfile
      dns_listen: "10.77.77.1:53"
      preview_tls: ""
      access_log: stdout
    runtime: kube
    kube:
      namespace: agent-sandbox
      image: "registry.example.com/agent-sandbox/agent:latest"
      image_pull_policy: IfNotPresent
      service_account: agent
      network_attachment: agent-sandbox/sandbox-vlan
      token_audience: agent-sandbox
      runtime_class: ""
      storage_class: ""
      volume_size: 10Gi
      cpu_request: "250m"
      cpu_limit: "2"
      memory_request: "1Gi"
      memory_limit: "4Gi"
      harness_command: "claude -p \"$SANDBOX_TASK\" --output-format stream-json --verbose"
      harness_resume_command: "claude -p \"$SANDBOX_RESUME_PROMPT\" --resume \"$SANDBOX_SESSION\" --output-format stream-json --verbose"
      resume_prompt: ""
      termination_seconds: 30
      pod_firewall: true
      gateway_ca_configmap: "agent-sandbox-gateway-ca"
      env:
        ANTHROPIC_BASE_URL: "https://api.anthropic.com"
    sandbox:
      default_idle_timeout: 1h
      ready_timeout: 3m
      idle_check_every: 1m
    preview:
      domain: preview.example.com
      auth_url: "https://ai.example.com/api/preview/auth"
      ticket_key: "${PREVIEW_TICKET_KEY}"
      cookie_ttl: 1h
      hits_as_activity: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-sandboxd-policies
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
data:
  backend-dev.yaml: |
    # yaml-language-server: $schema=./schema.json
    # backend-dev: full git flow (push is further limited to agent/* branches by Forgejo branch
    # protection and the per-agent token), LLM API, MCP read-only.
    slug: backend-dev
    tenants: ["*"]        # any tenant may create backend-dev sandboxes; list tenants to restrict
    allow:
      - host: git.example.com
        paths: ["/*/*/info/refs", "/*/*/git-upload-pack", "/*/*/git-receive-pack"]
        inject:
          Authorization: "Basic secret:forgejo-basic"
      - host: api.anthropic.com
        paths: ["/v1/**"]
        methods: [POST]
        inject:
          x-api-key: "secret:anthropic"
      - host: mcp.example.com
        paths: ["/mcp", "/mcp/**"]
        mcp: { read_only: true }
  default.yaml: |
    # yaml-language-server: $schema=./schema.json
    # Fallback policy for slugs without their own file. Read-only Git and the LLM API, nothing else.
    slug: default
    allow:
      - host: git.example.com
        paths: ["/*/*/info/refs", "/*/*/git-upload-pack"]
        inject:
          Authorization: "Basic secret:forgejo-basic"
      - host: api.anthropic.com
        paths: ["/v1/**"]
        inject:
          x-api-key: "secret:anthropic"
  netops.yaml: |
    # yaml-language-server: $schema=./schema.json
    # netops: NetBox read-only plus Git read-only. No push, no LLM key of its own (shared one).
    slug: netops
    tenants: [netops]     # only the netops tenant (and the admin) may run this agent
    allow:
      - host: git.example.com
        paths: ["/*/*/info/refs", "/*/*/git-upload-pack"]
        inject:
          Authorization: "Basic secret:forgejo-basic"
      - host: netbox.example.com
        paths: ["/api/**"]
        methods: [GET, HEAD]
        inject:
          Authorization: "Token secret:netbox"
      - host: api.anthropic.com
        paths: ["/v1/**"]
        inject:
          x-api-key: "secret:anthropic"
---
# Agent CA key (ca.source file) and rendered Caddyfile. Losing the CA key means re-issuing every
# identity: back it up. With ca.source db both CAs live in Postgres and no claim is created.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-sandbox-sandboxd-var
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
# Caddy's internal CA and issued certificates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-sandbox-sandboxd-caddy
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
# TokenReview is cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-sandboxd-tokenreview
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-sandboxd-tokenreview
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-sandbox-sandboxd-tokenreview
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-sandboxd
    namespace: agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-sandboxd
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  # the gateway root published for the pods' init container
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-sandboxd
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-sandbox-sandboxd
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-sandboxd
    namespace: agent-sandbox
---
# Client-facing API. With hostNetwork the API is also reachable on the gateway node's address.
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-sandboxd
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
  ports:
    - { name: api, port: 8080, targetPort: 8080 }
---
# The gateway pod: Caddy and sandboxd share the node's network namespace, so Caddy binds
# :443/:8443 on the VLAN address and talks to sandboxd on localhost, exactly like the VM layout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-sandboxd
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox
      app.kubernetes.io/instance: agent-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox
        app.kubernetes.io/instance: agent-sandbox
        app.kubernetes.io/version: "0.1.0"
        helm.sh/chart: agent-sandbox-0.1.0
      annotations:
        checksum/config: 8d40d2a2200d8d7962f50d183ebe963f8480b88aa6c25370ad4e9c4c50352157
    spec:
      serviceAccountName: agent-sandbox-sandboxd
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        agent-sandbox.io/gateway: "true"
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          image: caddy:2
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - { name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile.bootstrap, readOnly: true }
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
        - name: sandboxd
          image: "registry.example.com/agent-sandbox/sandboxd:latest"
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/sandbox/sandboxd.yaml"]
          envFrom:
            - secretRef:
                name: agent-sandbox-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # DNS on :53
          volumeMounts:
            - { name: config, mountPath: /etc/sandbox/sandboxd.yaml, subPath: sandboxd.yaml, readOnly: true }
            - { name: policies, mountPath: /etc/sandbox/policies, readOnly: true }
            - { name: var, mountPath: /var/lib/sandboxd }
      volumes:
        - name: config
          configMap: { name: agent-sandbox-sandboxd-config }
        - name: policies
          configMap: { name: agent-sandbox-sandboxd-policies }
        - name: var
          persistentVolumeClaim: { claimName: agent-sandbox-sandboxd-var }
        - name: caddy-data
          persistentVolumeClaim: { claimName: agent-sandbox-sandboxd-caddy }
        - name: caddy-config
          emptyDir: {}
---
# Requires Multus and whereabouts to be installed on the cluster.
#
# Isolation: macvlan "private" keeps pods on one node from seeing each other, but pods on
# different nodes share the VLAN and could reach each other directly, bypassing the gateway.
# Two layers close that: the pod firewall sandboxd installs in every pod (agent.podFirewall,
# egress only to the gateway) and, where the switch supports it, an isolated private VLAN with
# the gateway port as the only promiscuous port. Preview traffic never enters the VLAN from the
# outside: it reaches sandboxd on the gateway, which proxies to the pod.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sandbox-vlan
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/instance: agent-sandbox
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: agent-sandbox-0.1.0
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "sandbox-vlan",
      "type": "macvlan",
      "master": "eth1",
      "mode": "private",
      "ipam": {
        "type": "whereabouts",
        "range": "10.77.77.0/25",
        "range_start": "10.77.77.10",
        "range_end": "10.77.77.126",
        "exclude": ["10.77.77.1/32"],
        "gateway": "10.77.77.1",
        "routes": [ { "dst": "0.0.0.0/0", "gw": "10.77.77.1" } ]
      }
    }

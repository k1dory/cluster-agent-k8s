#!/usr/sbin/nft -f
# Gateway VM firewall for the sandbox VLAN interface (sbx0, 10.77.77.1/25).
# Pods may talk to the gateway on DNS, 443 and 8443 only. Nothing is forwarded.
# This protects the gateway host; pod-to-pod traffic across nodes never passes here. That is
# covered by the firewall inside every pod (kube.pod_firewall) and by an isolated private VLAN
# on the switch where available.
flush table inet sbxgw
table inet sbxgw {
	chain input {
		type filter hook input priority 0; policy accept;
		iifname "sbx0" jump from_sandbox
	}
	chain from_sandbox {
		ct state established,related accept
		ip saddr != 10.77.77.0/25 drop
		meta nfproto ipv6 drop
		udp dport 53 accept
		tcp dport 53 accept
		tcp dport { 443, 8443 } accept
		icmp type echo-request accept
		counter drop
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
		# no routing for the sandbox VLAN at all: egress is HTTP through Caddy only
		iifname "sbx0" counter drop
		oifname "sbx0" counter drop
	}
}

# dnsmasq on the gateway VM, listening only on the sandbox interface.
# Every allowlisted name resolves to the gateway; everything else is NXDOMAIN.
# Pods use this server exclusively (dnsPolicy: None, nameserver 10.77.77.1).
interface=sbx0
bind-interfaces
no-resolv
no-hosts
# no upstream servers: unknown names fail instead of leaking DNS queries
address=/git.example.com/10.77.77.1
address=/api.anthropic.com/10.77.77.1
address=/mcp.example.com/10.77.77.1
address=/netbox.example.com/10.77.77.1
address=/api.sandbox.internal/10.77.77.1
address=/registrar.sandbox.internal/10.77.77.1
# refuse AAAA so clients do not try IPv6 paths
filter-AAAA
log-queries

# Git adapter for GitLab: the same three jobs as the GitHub workflow (deploy/git/github), for a
# configuration repository that changes the platform through merge requests alone.
#
#   merge request      → plan every bundle; the plan is the job log, an artifact and, with
#                        GITLAB_TOKEN (api scope), one note on the merge request updated per push;
#                        an invalid bundle fails the job
#   default branch     → apply every bundle with the commit as the source of every new revision
#                        (a push only, never a schedule), under a key stable for the bundle at
#                        that commit: retrying the job continues a stopped apply
#   scheduled pipeline → drift
#
# CI/CD variables: SANDBOXD_URL, SANDBOXD_TOKEN (optional, masked; a tenant key sbk_… or the admin
# token: without it the job exchanges the ID token GitLab issues to it for a short-lived key under
# a CITrust the tenant registered for this project, docs/ci-auth.md),
# SANDBOXCTL_IMAGE (the sandboxctl image built from the platform repository: `make images`, target
# sandboxctl; it carries sh, curl, jq and git next to the binary), SANDBOX_TENANT (admin
# repositories only), GITLAB_TOKEN (optional, for the note).
variables:
  SANDBOXCTL_IMAGE: registry.example.com/agent-sandbox/sandboxctl:latest
  GIT_DEPTH: "0"

default:
  image:
    name: $SANDBOXCTL_IMAGE
    entrypoint: [""]
  # The ID token GitLab issues to the job, for the platform as its audience (what the trust names).
  id_tokens:
    SANDBOX_ID_TOKEN:
      aud: $SANDBOXD_URL
  before_script:
    - test -n "$SANDBOXD_URL" || { echo "SANDBOXD_URL is required"; exit 1; }
    # The exchange's own exit status fails the job (`export X=$(…)` would hide it).
    - if [ -z "$SANDBOXD_TOKEN" ]; then SANDBOXD_TOKEN=$(/sandboxctl auth ci -token "$SANDBOX_ID_TOKEN") || exit 1; export SANDBOXD_TOKEN; fi

plan:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["bundles/**"]
  script:
    # The job shell stops at the first failing command, so every exit code is caught with
    # `|| code=$?`: the note is posted (and the artifact kept) for an invalid bundle or an
    # unreachable platform too, and the job fails afterwards with that code.
    - 'rc=0; : > plans.md'
    - |
      for f in bundles/*.yaml; do
        code=0
        /sandboxctl plan -f "$f" ${SANDBOX_TENANT:+-tenant "$SANDBOX_TENANT"} -markdown >> plans.md || code=$?
        echo >> plans.md
        if [ "$code" -ne 0 ]; then rc=$code; fi
      done
    - cat plans.md
    # One note per merge request, found by the marker line and updated on every push.
    - |
      if [ -n "$GITLAB_TOKEN" ]; then
        api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        id=$(curl -sSf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api?per_page=100" | jq -r '[.[] | select(.body | startswith("<!-- agent-sandbox -->"))][0].id // empty')
        body=$(jq -Rs '{body: .}' plans.md)
        if [ -n "$id" ]; then
          curl -sSf -X PUT -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" -d "$body" "$api/$id" >/dev/null
        else
          curl -sSf -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" -d "$body" "$api" >/dev/null
        fi
      fi
    - exit $rc
  artifacts:
    when: always
    paths: [plans.md]
    expire_in: 30 days

apply:
  stage: deploy
  rules:
    # A push to the default branch that touched a bundle. The pipeline source matters: on a
    # scheduled pipeline `changes` is always true, and a schedule must never apply.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["bundles/**"]
  resource_group: sandbox-apply   # one apply at a time; each is continued by key anyway
  script:
    # -require-commit: the job fails rather than apply without the commit's SHA; the key is the
    # bundle at this commit, so retrying the job continues the same apply where it stopped.
    - 'rc=0; : > apply.md'
    - |
      for f in bundles/*.yaml; do
        code=0
        /sandboxctl apply -f "$f" ${SANDBOX_TENANT:+-tenant "$SANDBOX_TENANT"} -ref "$CI_COMMIT_BRANCH" -repo "$CI_PROJECT_URL" -key "$f@$CI_COMMIT_SHA" -require-commit -markdown >> apply.md || code=$?
        echo >> apply.md
        if [ "$code" -ne 0 ]; then rc=$code; fi   # 2 invalid, 3 stopped (retry the job once fixed), 1 unreachable or no SHA
      done
    - cat apply.md
    - exit $rc
  artifacts:
    when: always
    paths: [apply.md]
    expire_in: 90 days

drift:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    # exit 3 on drift: alert on the failed pipeline; the report is the artifact
    - 'rc=0; /sandboxctl drift ${SANDBOX_TENANT:+-tenant "$SANDBOX_TENANT"} -markdown > drift.md || rc=$?; cat drift.md; exit $rc'
  artifacts:
    when: always
    paths: [drift.md]
    expire_in: 30 days

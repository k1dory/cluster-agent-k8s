# Git adapter for GitHub: a configuration repository (bundles of AgentDefinition, EnvironmentProfile,
# Connection; the admin's bundles also PolicyBinding and TenantSettings) changes the platform
# through pull requests alone. Copy to .github/workflows/sandbox-config.yml of that repository.
#
#   pull request  → plan every bundle, post or update one comment per bundle with the plan; a bundle
#                   that is invalid fails the check, so it cannot be merged
#   push to main  → apply every bundle under a key stable for the bundle at that commit; the merge
#                   commit's SHA lands in every new revision (the job fails rather than apply
#                   without one); the job summary shows what was written; a stopped apply fails
#                   the job, and re-running the job continues it
#   schedule      → drift: items changed or deleted by hand since an apply wrote them fail the job
#
# Secrets: SANDBOXD_URL (variable) and, optionally, SANDBOXD_TOKEN (a tenant key sbk_… for a tenant's
# repository, the admin token for the platform's). Without SANDBOXD_TOKEN the job authenticates
# with the OIDC token GitHub issues to it, under a CITrust the tenant registered for this
# repository (docs/ci-auth.md): nothing long-lived is stored here. sandboxctl runs from the
# sandboxctl image (built from the platform repository with `make images`, target sandboxctl), so
# the job needs no Go toolchain.
name: sandbox-config
on:
  pull_request:
    paths: ["bundles/**"]
  push:
    branches: [main]
    paths: ["bundles/**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  SANDBOXD_URL: ${{ vars.SANDBOXD_URL }}
  SANDBOXD_TOKEN: ${{ secrets.SANDBOXD_TOKEN }}
  SANDBOXCTL_IMAGE: ${{ vars.SANDBOXCTL_IMAGE || 'registry.example.com/agent-sandbox/sandboxctl:latest' }}
  # Documents without a tenant go to this scope (admin repositories only; leave empty for a tenant key).
  SANDBOX_TENANT: ${{ vars.SANDBOX_TENANT }}

permissions:
  contents: read
  pull-requests: write
  id-token: write      # the OIDC token the job exchanges for a short-lived key (docs/ci-auth.md)

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plan every bundle
        id: plan
        shell: bash
        run: |
          # Without a stored SANDBOXD_TOKEN the job proves who it is with the OIDC token GitHub
          # issues to it, exchanged for a tenant key that expires in minutes under a CITrust that
          # names this repository (docs/ci-auth.md). With a stored key, that key is used as before.
          if [ -z "$SANDBOXD_TOKEN" ]; then
            SANDBOXD_TOKEN=$(docker run --rm -e SANDBOXD_URL -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN "$SANDBOXCTL_IMAGE" auth ci -github) || exit 1
            echo "::add-mask::$SANDBOXD_TOKEN"
            export SANDBOXD_TOKEN
          fi
          # Any failure fails the check: 2 invalid, 1 the platform could not be reached or refused
          # the token, 125-127 the image could not run. Every bundle still gets its block in the
          # comment: sandboxctl writes one for its own failures; when the container did not run
          # at all, the loop writes it.
          set +e
          rc=0
          : > plans.md
          for f in bundles/*.yaml; do
            docker run --rm -e SANDBOXD_URL -e SANDBOXD_TOKEN -v "$PWD:/w" -w /w "$SANDBOXCTL_IMAGE" \
              plan -f "$f" ${SANDBOX_TENANT:+-tenant "$SANDBOX_TENANT"} -markdown > plan.md
            code=$?
            if [ "$code" -ne 0 ] && ! grep -q '<!-- agent-sandbox -->' plan.md; then
              printf '<!-- agent-sandbox -->\n### Plan ❌ error · `%s`\n\nsandboxctl exited %d without a plan (the image could not run; see the job log).\n' "$f" "$code" > plan.md
            fi
            cat plan.md >> plans.md
            echo >> plans.md
            if [ "$code" -ne 0 ]; then
              rc=$code
            fi
          done
          cat plans.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: post or update the plan comment
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plans.md', 'utf8');
            const marker = '<!-- agent-sandbox -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker) && c.user.type === 'Bot');
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: sandbox-apply   # one apply at a time per repository; each is continued by key anyway
    steps:
      - uses: actions/checkout@v4
      - name: apply every bundle with this commit as the source
        shell: bash
        run: |
          # Without a stored SANDBOXD_TOKEN the job proves who it is with the OIDC token GitHub
          # issues to it, exchanged for a tenant key that expires in minutes under a CITrust that
          # names this repository (docs/ci-auth.md). With a stored key, that key is used as before.
          if [ -z "$SANDBOXD_TOKEN" ]; then
            SANDBOXD_TOKEN=$(docker run --rm -e SANDBOXD_URL -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN "$SANDBOXCTL_IMAGE" auth ci -github) || exit 1
            echo "::add-mask::$SANDBOXD_TOKEN"
            export SANDBOXD_TOKEN
          fi
          set +e
          rc=0
          for f in bundles/*.yaml; do
            # The checkout is a detached HEAD: name the branch; the commit and the path are detected
            # from the work tree. -require-commit fails the job instead of applying without a SHA
            # (a file that differs from the commit, or a checkout Git cannot read). The key is the
            # bundle at this commit: a re-run of the job continues the same apply where it stopped
            # instead of starting another one.
            docker run --rm -e SANDBOXD_URL -e SANDBOXD_TOKEN -v "$PWD:/w" -w /w "$SANDBOXCTL_IMAGE" \
              apply -f "$f" ${SANDBOX_TENANT:+-tenant "$SANDBOX_TENANT"} -ref "$GITHUB_REF_NAME" -repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -key "$f@$GITHUB_SHA" -require-commit -markdown > apply.md
            code=$?
            if [ "$code" -ne 0 ] && ! grep -q '<!-- agent-sandbox -->' apply.md; then
              printf '<!-- agent-sandbox -->\n### Apply ❌ error · `%s`\n\nsandboxctl exited %d without a result (the image could not run; see the job log).\n' "$f" "$code" > apply.md
            fi
            cat apply.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then
              rc=$code                        # 2 invalid, 3 stopped (re-run the job once fixed: same key), 1 unreachable or no SHA
            fi
          done
          exit $rc

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: what moved outside apply
        shell: bash
        run: |
          # Without a stored SANDBOXD_TOKEN the job proves who it is with the OIDC token GitHub
          # issues to it, exchanged for a tenant key that expires in minutes under a CITrust that
          # names this repository (docs/ci-auth.md). With a stored key, that key is used as before.
          if [ -z "$SANDBOXD_TOKEN" ]; then
            SANDBOXD_TOKEN=$(docker run --rm -e SANDBOXD_URL -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN "$SANDBOXCTL_IMAGE" auth ci -github) || exit 1
            echo "::add-mask::$SANDBOXD_TOKEN"
            export SANDBOXD_TOKEN
          fi
          # The report is written to a file, then shown: no pipe between sandboxctl and the summary,
          # so its exit code is the step's. 3 when anything drifted (wire the job's failure to your
          # paging), 1 when the platform could not be reached or refused the token.
          set +e
          docker run --rm -e SANDBOXD_URL -e SANDBOXD_TOKEN "$SANDBOXCTL_IMAGE" \
            drift ${SANDBOX_TENANT:+-tenant "$SANDBOX_TENANT"} -markdown > drift.md
          code=$?
          cat drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-sandbox.fullname" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
---
# Identity of agent pods. No RBAC at all: the projected token is only a bootstrap credential
# that the Registrar verifies with TokenReview.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agent.serviceAccount }}
  namespace: {{ include "agent-sandbox.agentNamespace" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
automountServiceAccountToken: false

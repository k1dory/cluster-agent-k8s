{{- if eq .Values.gateway.mode "node" }}
# Client-facing API. With hostNetwork the API is also reachable on the gateway node's address.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox.fullname" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "agent-sandbox.selector" . | nindent 4 }}
  ports:
    - { name: api, port: 8080, targetPort: {{ .Values.gateway.apiPort }} }
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox.fullname" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "agent-sandbox.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: api, port: 8080, targetPort: api }
    - { name: gateway, port: 8081, targetPort: gateway }
    - { name: ingress, port: 8082, targetPort: ingress }

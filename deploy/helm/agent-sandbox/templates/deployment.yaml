{{- if eq .Values.gateway.mode "node" }}
# The gateway pod: Caddy and sandboxd share the node's network namespace, so Caddy binds
# :443/:8443 on the VLAN address and talks to sandboxd on localhost, exactly like the VM layout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-sandbox.fullname" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: Recreate
  {{- if gt (int .Values.gateway.replicas) 1 }}
  {{- if ne .Values.sandboxd.ca.source "db" }}
  {{- fail "gateway.replicas > 1 requires sandboxd.ca.source: db (one agent CA shared through Postgres)" }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels: {{- include "agent-sandbox.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agent-sandbox.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "agent-sandbox.fullname" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {{- toYaml .Values.gateway.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (int .Values.gateway.replicas) 1 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {{- include "agent-sandbox.selector" . | nindent 18 }}
      {{- end }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: caddy
          image: {{ .Values.gateway.caddyImage }}
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          {{- if .Values.gateway.caddyEnvSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.gateway.caddyEnvSecret }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - { name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile.bootstrap, readOnly: true }
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
            {{- if eq .Values.sandboxd.ca.source "db" }}
            # the gateway root sandboxd writes from the database; Caddy signs its sites under it
            - { name: var, mountPath: /var/lib/sandboxd, readOnly: true }
            {{- end }}
        - name: sandboxd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/sandbox/sandboxd.yaml"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.gateway.apiPort }} }
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.gateway.apiPort }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # DNS on :53
          volumeMounts:
            - { name: config, mountPath: /etc/sandbox/sandboxd.yaml, subPath: sandboxd.yaml, readOnly: true }
            - { name: policies, mountPath: /etc/sandbox/policies, readOnly: true }
            - { name: var, mountPath: /var/lib/sandboxd }
            {{- if .Values.tenantSecretsSecret }}
            - { name: tenant-secrets, mountPath: /etc/sandbox/secrets, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "agent-sandbox.fullname" . }}-config }
        - name: policies
          configMap: { name: {{ include "agent-sandbox.fullname" . }}-policies }
        {{- if eq .Values.sandboxd.ca.source "db" }}
        # Nothing on disk is precious with the CAs in the database: scratch volumes, so replicas
        # schedule on any gateway node without a ReadWriteOnce claim pinning them.
        - name: var
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        {{- else }}
        - name: var
          persistentVolumeClaim: { claimName: {{ include "agent-sandbox.fullname" . }}-var }
        - name: caddy-data
          persistentVolumeClaim: { claimName: {{ include "agent-sandbox.fullname" . }}-caddy }
        {{- end }}
        - name: caddy-config
          emptyDir: {}
        {{- if .Values.tenantSecretsSecret }}
        - name: tenant-secrets
          secret: { secretName: {{ .Values.tenantSecretsSecret }} }
        {{- end }}
{{- if ne .Values.sandboxd.ca.source "db" }}
---
# Agent CA key (ca.source file) and rendered Caddyfile. Losing the CA key means re-issuing every
# identity: back it up. With ca.source db both CAs live in Postgres and no claim is created.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-var
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.caStorage }}
---
# Caddy's internal CA and issued certificates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-caddy
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.caStorage }}
{{- end }}
{{- end }}

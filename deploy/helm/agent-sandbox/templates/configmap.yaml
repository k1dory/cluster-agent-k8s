{{- if eq .Values.gateway.mode "node" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-config
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
data:
  Caddyfile.bootstrap: |
    {
    	skip_install_trust
    	admin 127.0.0.1:2019
    }
  sandboxd.yaml: |
    listen:
      api: ":{{ .Values.gateway.apiPort }}"
      gateway: "127.0.0.1:8081"
      ingress: "127.0.0.1:8082"
    api_token: "${SANDBOXD_API_TOKEN}"
    database_url: "${DATABASE_URL}"
    policies_dir: /etc/sandbox/policies
    policies_strict: {{ .Values.sandboxd.policiesStrict }}
    {{- if .Values.sandboxd.oidc.issuer }}
    oidc:
      issuer: {{ .Values.sandboxd.oidc.issuer | quote }}
      client_id: {{ .Values.sandboxd.oidc.clientId | quote }}
      tenant_claim: {{ .Values.sandboxd.oidc.tenantClaim | quote }}
      tenant_prefix: {{ .Values.sandboxd.oidc.tenantPrefix | quote }}
      admin_claim: {{ .Values.sandboxd.oidc.adminClaim | quote }}
      admin_value: {{ .Values.sandboxd.oidc.adminValue | quote }}
      ttl_from_token: {{ .Values.sandboxd.oidc.ttlFromToken }}
    {{- end }}
    {{- if .Values.tenantSecretsSecret }}
    secrets_dir: /etc/sandbox/secrets
    {{- end }}
    {{- $sec := .Values.sandboxd.secrets }}
    {{- if ne $sec.provider "file" }}
    secrets:
      provider: {{ $sec.provider }}
      cache_ttl: {{ $sec.cacheTtl }}
      {{- if eq $sec.provider "vault" }}
      vault:
        addr: {{ $sec.vault.addr | quote }}
        token: "${VAULT_TOKEN}"
        kubernetes_role: {{ $sec.vault.kubernetesRole | quote }}
        kubernetes_mount: {{ $sec.vault.kubernetesMount | quote }}
        mount: {{ $sec.vault.mount | quote }}
        tenant_path: {{ $sec.vault.tenantPath | quote }}
        shared_path: {{ $sec.vault.sharedPath | quote }}
        namespace: {{ $sec.vault.namespace | quote }}
      {{- end }}
      {{- if eq $sec.provider "infisical" }}
      infisical:
        site_url: {{ $sec.infisical.siteUrl | quote }}
        client_id: "${INFISICAL_CLIENT_ID}"
        client_secret: "${INFISICAL_CLIENT_SECRET}"
        project_id: {{ $sec.infisical.projectId | quote }}
        environment: {{ $sec.infisical.environment | quote }}
        tenant_path: {{ $sec.infisical.tenantPath | quote }}
        shared_path: {{ $sec.infisical.sharedPath | quote }}
      {{- end }}
    {{- end }}
    ca:
      dir: /var/lib/sandboxd/ca
      source: {{ .Values.sandboxd.ca.source }}
      cert_ttl: {{ .Values.sandboxd.certTtl }}
    agent:
      default: {{ .Values.agent.defaultVersion | quote }}
      versions:
        {{- range $k, $v := .Values.agent.versions }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    gateway:
      ip: {{ .Values.gateway.ip }}
      caddy_admin: http://127.0.0.1:2019
      caddyfile_out: /var/lib/sandboxd/Caddyfile
      dns_listen: "{{ .Values.gateway.ip }}:53"
      preview_tls: {{ .Values.gateway.previewTls | quote }}
      access_log: {{ .Values.gateway.accessLog }}
    runtime: kube
    kube:
      namespace: {{ include "agent-sandbox.agentNamespace" . }}
      image: "{{ .Values.agentImage.repository }}:{{ .Values.agentImage.tag }}"
      image_pull_policy: {{ .Values.agentImage.pullPolicy }}
      service_account: {{ .Values.agent.serviceAccount }}
      network_attachment: {{ include "agent-sandbox.agentNamespace" . }}/{{ .Values.network.name }}
      token_audience: {{ .Values.agent.tokenAudience }}
      runtime_class: {{ .Values.agent.runtimeClass | quote }}
      storage_class: {{ .Values.agent.storageClass | quote }}
      volume_size: {{ .Values.agent.volumeSize }}
      cpu_request: {{ .Values.agent.resources.cpuRequest | quote }}
      cpu_limit: {{ .Values.agent.resources.cpuLimit | quote }}
      memory_request: {{ .Values.agent.resources.memoryRequest | quote }}
      memory_limit: {{ .Values.agent.resources.memoryLimit | quote }}
      harness_command: {{ .Values.agent.harnessCommand | quote }}
      harness_resume_command: {{ .Values.agent.harnessResumeCommand | quote }}
      resume_prompt: {{ .Values.agent.resumePrompt | quote }}
      termination_seconds: {{ .Values.agent.terminationSeconds }}
      env:
        {{- range $k, $v := .Values.agent.env }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    sandbox:
      default_idle_timeout: {{ .Values.sandboxd.sandbox.defaultIdleTimeout }}
      ready_timeout: {{ .Values.sandboxd.sandbox.readyTimeout }}
      idle_check_every: {{ .Values.sandboxd.sandbox.idleCheckEvery }}
    preview:
      domain: {{ .Values.sandboxd.preview.domain }}
      auth_url: {{ .Values.sandboxd.preview.authUrl | quote }}
      ticket_key: "${PREVIEW_TICKET_KEY}"
      cookie_ttl: {{ .Values.sandboxd.preview.cookieTtl }}
      hits_as_activity: {{ .Values.sandboxd.preview.hitsAsActivity }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-policies
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
data:
{{- if .Values.policiesFromFiles }}
{{ (.Files.Glob "policies/*.yaml").AsConfig | indent 2 }}
{{- end }}
{{- end }}

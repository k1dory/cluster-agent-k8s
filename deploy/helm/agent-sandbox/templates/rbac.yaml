apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-sandbox.fullname" . }}
  namespace: {{ include "agent-sandbox.agentNamespace" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-sandbox.fullname" . }}
  namespace: {{ include "agent-sandbox.agentNamespace" . }}
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-sandbox.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-sandbox.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# TokenReview is cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-tokenreview
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-tokenreview
  labels: {{- include "agent-sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-sandbox.fullname" . }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-sandbox.fullname" . }}
    namespace: {{ .Release.Namespace }}

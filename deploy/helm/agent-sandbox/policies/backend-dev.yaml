# yaml-language-server: $schema=./schema.json
# backend-dev: full git flow (push is further limited to agent/* branches by Forgejo branch
# protection and the per-agent token), LLM API, MCP read-only.
slug: backend-dev
tenants: ["*"]        # any tenant may create backend-dev sandboxes; list tenants to restrict
allow:
  - host: git.example.com
    paths: ["/*/*/info/refs", "/*/*/git-upload-pack", "/*/*/git-receive-pack"]
    inject:
      Authorization: "Basic secret:forgejo-basic"
  - host: api.anthropic.com
    paths: ["/v1/**"]
    methods: [POST]
    inject:
      x-api-key: "secret:anthropic"
  - host: mcp.example.com
    paths: ["/mcp", "/mcp/**"]
    mcp: { read_only: true }

# agent-sandbox Helm chart.
#
# gateway.mode decides where the control plane runs:
#   node      Caddy + sandboxd run as one hostNetwork pod on a cluster node that has an interface
#             in the sandbox VLAN (label it agent-sandbox.io/gateway=true). Everything via Helm.
#   external  the gateway is a separate VM (deploy/gateway/docker-compose.yaml); the chart only
#             creates the cluster-side pieces and a ServiceAccount token for that sandboxd.

gateway:
  mode: node
  # replicas > 1 needs: several labelled gateway nodes (one Caddy + sandboxd per node, a VIP or
  # DNS round-robin in front of them), Postgres (database_url) and sandboxd.ca.source db, so every
  # replica signs agent identities with one key and every Caddy issues site certificates under one
  # shared gateway root. The reconciler runs on the replica holding the lease; writes are
  # revision-checked, quotas are decided under a shared lock.
  replicas: 1
  nodeSelector:
    agent-sandbox.io/gateway: "true"
  ip: 10.77.77.1                 # gateway address on the sandbox VLAN
  caddyImage: caddy:2
  previewTls: ""                 # "" = on-demand certificates; or "dns cloudflare {env.CF_API_TOKEN}" with a custom Caddy build
  caddyEnvSecret: ""             # optional Secret with DNS-provider credentials for Caddy
  accessLog: stdout
  apiPort: 8080                  # API clients reach this on the gateway node's address

image:
  repository: registry.example.com/agent-sandbox/sandboxd
  tag: latest
  pullPolicy: IfNotPresent

agentImage:
  repository: registry.example.com/agent-sandbox/agent
  tag: latest
  pullPolicy: IfNotPresent

# Secrets are referenced, never written here.
existingSecret: agent-sandbox-secrets   # keys: SANDBOXD_API_TOKEN, DATABASE_URL, PREVIEW_TICKET_KEY
tenantSecretsSecret: ""                 # optional: mounted at /etc/sandbox/secrets (tenants/<t>/<name>, shared/<name>)
caStorage: 100Mi                        # PVC for the agent CA key; back it up

sandboxd:
  sandbox:
    defaultIdleTimeout: 1h
    readyTimeout: 3m
    idleCheckEvery: 1m
  preview:
    domain: preview.example.com
    authUrl: https://ai.example.com/api/preview/auth
    cookieTtl: 1h
    hitsAsActivity: true
  certTtl: 168h
  ca:
    source: file          # file (PVC) | db (shared through Postgres; required for replicas > 1)
  # policiesStrict: a policy without a tenants list is admin-only and a slug without a policy file
  # is refused for tenants (no fallback to default).
  policiesStrict: false
  # Tenant API keys are issued through the API (sandboxctl keys create -tenant acme -name ci), so
  # a new tenant never needs a chart change. maxTTL caps a key's lifetime ("0" = may be permanent).
  apiKeys:
    maxTTL: "0"
  # OIDC: accept JWTs from this issuer next to the static tokens. Leave issuer empty to disable.
  oidc:
    issuer: ""                      # https://login.example.com/realms/platform
    clientId: sandboxd              # expected audience
    tenantClaim: tenant             # or groups + tenantPrefix "sandbox-tenant:"
    tenantPrefix: ""
    adminClaim: roles
    adminValue: sandbox-admin
    ttlFromToken: true              # sandboxes and agent certificates expire with the token
  # Where `secret:NAME` references in policies are resolved: file (tenantSecretsSecret mounted
  # at /etc/sandbox/secrets), vault (Vault or OpenBao KV v2) or infisical.
  secrets:
    provider: file
    cacheTtl: 60s
    vault:
      addr: ""                      # https://vault.example.com
      kubernetesRole: sandboxd      # Kubernetes auth with the sandboxd ServiceAccount token
      kubernetesMount: kubernetes
      mount: secret
      tenantPath: agent-sandbox/tenants/{tenant}
      sharedPath: agent-sandbox/shared
      namespace: ""
      # a static token instead of Kubernetes auth: put VAULT_TOKEN into existingSecret
    infisical:
      siteUrl: https://app.infisical.com
      projectId: ""
      environment: prod
      tenantPath: /tenants/{tenant}
      sharedPath: /shared
      # INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET come from existingSecret

# How agent pods are built.
agent:
  namespace: ""            # defaults to the release namespace
  serviceAccount: agent
  tokenAudience: agent-sandbox
  runtimeClass: ""         # gvisor | kata later
  storageClass: ""
  volumeSize: 10Gi
  resources:
    cpuRequest: 250m
    cpuLimit: "2"
    memoryRequest: 1Gi
    memoryLimit: 4Gi
  harnessCommand: 'claude -p "$SANDBOX_TASK" --output-format stream-json --verbose'
  # Continue a run interrupted by a forced rollout ($SANDBOX_SESSION is the harness session id
  # captured from its output). Codex: 'codex exec resume "$SANDBOX_SESSION" "$SANDBOX_RESUME_PROMPT" --json'
  harnessResumeCommand: 'claude -p "$SANDBOX_RESUME_PROMPT" --resume "$SANDBOX_SESSION" --output-format stream-json --verbose'
  resumePrompt: ""
  env:
    ANTHROPIC_BASE_URL: https://api.anthropic.com
  terminationSeconds: 30
  # Pod-level egress firewall: an init container with NET_ADMIN installs nftables rules in the
  # pod's network namespace (egress only to the gateway on 53/443/8443). This is what isolates
  # pods on different nodes: macvlan "private" only separates pods sharing one node's interface.
  # Keep it on unless your switch ports are configured as an isolated private VLAN with the
  # gateway as the only promiscuous port.
  podFirewall: true
  # ConfigMap (in the agent namespace) where sandboxd publishes the gateway root so the init
  # container can trust the registrar; "" disables the mount.
  gatewayCaConfigMap: agent-sandbox-gateway-ca
  # Version catalogue: names tenants may pass as agent_version (create) or version (rollout).
  # The admin may also pass any image reference. default: the image used when none is named
  # (empty = agentImage above).
  versions: {}
  #  stable: registry.example.com/agent-sandbox/agent:1.4.2
  #  canary: registry.example.com/agent-sandbox/agent:1.5.0-rc1
  defaultVersion: ""

# Multus NetworkAttachmentDefinition: the pod's ONLY network. macvlan in private mode so pods on
# one node cannot see each other; whereabouts IPAM gives cluster-wide unique addresses.
network:
  name: sandbox-vlan
  master: eth1            # node interface in the sandbox VLAN
  mode: private
  ipam:
    type: whereabouts
    range: 10.77.77.0/25
    range_start: 10.77.77.10
    range_end: 10.77.77.126
    gateway: 10.77.77.1
    exclude: ["10.77.77.1/32"]

createNamespace: false   # true when rendering plain manifests for kubectl apply

# Policies: every file under policies/ of the chart becomes a key of the ConfigMap (Policy-as-Code:
# keep that directory a copy of your policy repository, CI runs `sandboxd policy test` before helm upgrade).
policiesFromFiles: true

tolerations: []
